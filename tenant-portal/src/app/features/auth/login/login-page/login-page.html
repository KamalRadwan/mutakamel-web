@if (tenantProvisioning()) {
  <main class="login-provisioning relative grid place-items-center">
    <ui-preferences class="login-preferences absolute z-2" />
    <app-tenant-provisioning-page
      [checking]="checkingTenant()"
      (retryRequested)="checkTenantReadiness()"
    />
  </main>
} @else {
  <app-auth-card [title]="'auth.login.title' | transloco">
    <div role="status" [class]="verifyExpired() ? '' : 'sr-only'">
      @if (verifyExpired()) {
        <app-settings-notice tone="warning">{{ 'auth.login.verifyExpired' | transloco }}</app-settings-notice>
      }
    </div>

    <form class="login-form grid" novalidate (submit)="signIn($event)">
      <ui-field
        for="login-email"
        [label]="'auth.login.email' | transloco"
        [hint]="'auth.login.emailHint' | transloco"
        size="large"
        [required]="true"
        [error]="errorOf('email')"
      >
        <input
          id="login-email"
          type="email"
          dir="ltr"
          autocomplete="username"
          placeholder="name@company.com"
          class="min-w-0 flex-1 bg-transparent text-start outline-none placeholder:text-text-muted"
          [formField]="form.email"
          [attr.aria-describedby]="'login-email-hint' + (errorOf('email') ? ' login-email-error' : '')"
        />
      </ui-field>

      <ui-field
        class="mt-4"
        for="login-password"
        [label]="'auth.login.password' | transloco"
        [hint]="'auth.login.passwordHint' | transloco"
        size="large"
        [required]="true"
        [error]="errorOf('password')"
      >
        <input
          id="login-password"
          dir="ltr"
          autocomplete="current-password"
          class="min-w-0 flex-1 bg-transparent text-start outline-none"
          [type]="showPassword() ? 'text' : 'password'"
          [formField]="form.password"
          [attr.aria-describedby]="'login-password-hint' + (errorOf('password') ? ' login-password-error' : '')"
        />
        <button
          type="button"
          class="password-toggle grid shrink-0 cursor-pointer place-items-center self-stretch rounded-6 text-text-muted hover:text-text focus-visible:ring-2 focus-visible:ring-focus-ring"
          [attr.aria-label]="(showPassword() ? 'auth.login.hidePassword' : 'auth.login.showPassword') | transloco"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          <ng-icon [name]="showPassword() ? 'tablerEyeOff' : 'tablerEye'" size="18" aria-hidden="true" />
        </button>
      </ui-field>

      <div class="login-options flex min-h-btn flex-wrap items-center justify-between gap-x-12 gap-y-6">
        <ui-checkbox [formField]="form.remember" [title]="'auth.login.rememberHint' | transloco">
          {{ 'auth.login.remember' | transloco }}
        </ui-checkbox>
        <a routerLink="/reset-password" class="rounded-4 text-14 text-brand-text outline-none hover:underline focus-visible:ring-2 focus-visible:ring-focus-ring">
          {{ 'auth.login.forgot' | transloco }}
        </a>
      </div>

      <button uiButton type="submit" size="large" class="login-submit w-full" [disabled]="checkingTenant()" [loading]="form().submitting()">
        {{ 'auth.login.submit' | transloco }}
        @if (!form().submitting()) {
          <ng-icon name="tablerArrowRight" class="login-arrow" size="18" aria-hidden="true" />
        }
      </button>
    </form>
  </app-auth-card>
}
