<form class="flex flex-col gap-16" novalidate (submit)="onSubmit($event)">
  <div role="status" [class]="throttle.active() ? '' : 'sr-only'">
    @if (throttle.active()) {
      <app-settings-notice tone="warning">
        <span class="sr-only">{{ 'auth.shared.throttle' | transloco: { s: throttleInitial() } }}</span>
        <span aria-hidden="true">{{ 'auth.shared.throttle' | transloco: { s: throttle.remaining() } }}</span>
      </app-settings-notice>
    } @else if (throttleEnded()) {
      {{ 'auth.shared.throttleDone' | transloco }}
    }
  </div>

  @if (noticeKey(); as key) {
    <div
      role="alert"
      class="flex items-start gap-8 rounded-10 border border-danger-border bg-danger-soft px-10 py-6 text-12 leading-18 text-on-danger-soft"
    >
      <span class="mt-2 inline-flex shrink-0 text-danger-text">
        <ng-icon name="tablerCircleX" size="14" aria-hidden="true" />
      </span>
      <div class="min-w-0 flex-1">
        {{ key | transloco }}
      </div>
    </div>
  }

  <div class="flex flex-col gap-8">
    <ui-field
      for="reset-new-password"
      [label]="'auth.shared.newPassword' | transloco"
      [hint]="'auth.shared.newPasswordHint' | transloco"
      size="large"
      [required]="true"
      [error]="passwordErrorKey() ? (passwordErrorKey()! | transloco) : null"
    >
      <input
        id="reset-new-password"
        dir="ltr"
        autocomplete="new-password"
        class="min-w-0 flex-1 bg-transparent outline-none placeholder:text-text-placeholder"
        [type]="showNewPassword() ? 'text' : 'password'"
        [formField]="form.newPassword"
        [attr.aria-invalid]="passwordErrorKey() ? 'true' : null"
        [attr.aria-describedby]="'reset-new-password-hint' + (passwordErrorKey() ? ' reset-new-password-error' : '')"
        (input)="clearPasswordError()"
      />
      <button
        type="button"
        class="flex shrink-0 cursor-pointer items-center text-text-muted outline-none hover:text-text focus-visible:text-accent"
        [attr.aria-label]="(showNewPassword() ? 'auth.shared.hidePassword' : 'auth.shared.showPassword') | transloco"
        [attr.aria-pressed]="showNewPassword()"
        (click)="showNewPassword.set(!showNewPassword())"
      >
        <ng-icon [name]="showNewPassword() ? 'tablerEyeOff' : 'tablerEye'" size="16" aria-hidden="true" />
      </button>
    </ui-field>

    <app-auth-password-rules [password]="model().newPassword" [confirm]="model().confirmPassword" />
  </div>

  <ui-field
    for="reset-confirm-password"
    [label]="'auth.shared.confirmPassword' | transloco"
    [hint]="'auth.shared.confirmPasswordHint' | transloco"
    size="large"
    [required]="true"
  >
    <input
      id="reset-confirm-password"
      dir="ltr"
      autocomplete="new-password"
      class="min-w-0 flex-1 bg-transparent outline-none placeholder:text-text-placeholder"
      [type]="showConfirmPassword() ? 'text' : 'password'"
      [formField]="form.confirmPassword"
      aria-describedby="reset-confirm-password-hint"
    />
    <button
      type="button"
      class="flex shrink-0 cursor-pointer items-center text-text-muted outline-none hover:text-text focus-visible:text-accent"
      [attr.aria-label]="(showConfirmPassword() ? 'auth.shared.hidePassword' : 'auth.shared.showPassword') | transloco"
      [attr.aria-pressed]="showConfirmPassword()"
      (click)="showConfirmPassword.set(!showConfirmPassword())"
    >
      <ng-icon [name]="showConfirmPassword() ? 'tablerEyeOff' : 'tablerEye'" size="16" aria-hidden="true" />
    </button>
  </ui-field>

  <button
    uiButton
    type="submit"
    size="large"
    class="w-full"
    [loading]="form().submitting()"
    [disabled]="!canSubmit()"
  >
    {{ 'authReset.set.submit' | transloco }}
  </button>
</form>
