<ul aria-live="polite" class="flex flex-col gap-3">
  @for (row of rows(); track row.key) {
    <li class="flex items-center gap-6 text-11 leading-16">
      <ng-icon
        [name]="row.met ? 'tablerCircleCheck' : 'tablerCircle'"
        size="14"
        class="shrink-0"
        [class]="row.met ? 'text-success-text' : 'text-text-muted'"
        aria-hidden="true"
      />
      <span [class]="row.met ? 'text-text' : 'text-text-muted'">
        {{ row.labelKey | transloco }}
      </span>
    </li>
  }
</ul>
