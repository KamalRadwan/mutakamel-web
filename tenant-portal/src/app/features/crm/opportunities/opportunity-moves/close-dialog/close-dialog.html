<ui-modal
  size="form"
  [icon]="isWon() ? 'tablerTrophy' : 'tablerThumbDown'"
  [tile]="isWon() ? 'bg-icon-green' : 'bg-icon-red'"
  [title]="dialogTitle()"
  [subtitle]="dialogSubtitle()"
  [closeLabel]="'oppMoves.common.close' | transloco"
  [dismissable]="!isSubmitting()"
  [preventDismiss]="true"
  (dismiss)="cancel()"
  (closed)="onModalClosed()"
>
  @if (request()) {
    <div class="flex flex-col gap-10">
      @if (!reasonsHidden()) {
        <ui-field
          size="bare"
          [label]="reasonLabelKey() | transloco"
          [for]="reasonsLoading() ? '' : reasonId"
          [hint]="'oppMoves.close.reasonHint' | transloco"
          [required]="reasonRequired()"
          [error]="reasonError()"
        >
          @if (reasonsLoading()) {
            <div class="flex h-field items-center" role="status" aria-busy="true">
              <div class="h-skeleton-line w-full animate-pulse rounded-6 bg-neutral-soft"></div>
            </div>
          } @else {
            <div class="block min-w-0" [attr.title]="selectedReasonDefinition()">
              <ui-dropdown
                class="w-full"
                size="field"
                [id]="reasonId"
                [label]="reasonLabelKey() | transloco"
                [describedBy]="reasonDescribedBy()"
                [options]="reasonOptions()"
                [value]="selectedReasonId()"
                [disabled]="isSubmitting()"
                (valueChange)="onReasonChange($event)"
              />
            </div>
          }
        </ui-field>
      }

      @if (!isWon()) {
      <ui-field
        size="multiline"
        [label]="(isWon() ? 'oppMoves.close.note' : 'oppMoves.close.lossReason') | transloco"
        [for]="noteId"
        [hint]="noteHintKey() | transloco"
        [required]="noteRequired()"
        [count]="note().length"
        [max]="maxNoteLength"
        [error]="noteError()"
      >
        <textarea
          [id]="noteId"
          rows="3"
          [attr.maxlength]="maxNoteLength"
          class="w-full resize-none bg-transparent text-12 leading-18 text-text outline-none placeholder:text-text-placeholder disabled:cursor-not-allowed disabled:text-text-placeholder"
          [disabled]="isSubmitting()"
          [value]="note()"
          [attr.aria-describedby]="noteDescribedBy()"
          [attr.aria-invalid]="noteError() ? 'true' : null"
          (input)="onNoteInput($event)"
        ></textarea>
      </ui-field>
      }
    </div>
  }

  <ng-container modal-footer>
    <button
      type="button"
      uiButton
      variant="primary"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting() || reasonsLoading()"
      (click)="submit()"
    >
      {{ submitLabel() }}
    </button>
    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="isSubmitting()"
      (click)="cancel()"
    >
      {{ 'oppMoves.common.cancel' | transloco }}
    </button>
  </ng-container>
</ui-modal>
