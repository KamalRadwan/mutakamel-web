<app-bulk-run-modal
  size="form"
  icon="tablerTrash"
  tile="bg-icon-red"
  tone="danger"
  [title]="'oppBulk.delete.title' | transloco"
  [count]="displayCount()"
  [summary]="('oppBulk.count' | pluralKey: displayCount()) | transloco: { n: displayCount() }"
  [resolving]="resolving()"
  [submitting]="submitting()"
  [canSubmit]="canSubmit()"
  [dismissable]="false"
  [typedConfirm]="typedConfirmFrom"
  [typedConfirmWords]="typedConfirmWords()"
  [typedConfirmLabel]="'oppBulk.delete.typeLabel' | transloco: { n: displayCount() }"
  [typedConfirmHint]="'oppBulk.delete.typeHint' | transloco"
  [submitLabel]="('oppBulk.delete.go' | pluralKey: rows().length) | transloco: { n: rows().length }"
  (submit)="submit()"
  (closed)="onModalClosed()"
>
  <fieldset class="contents" [disabled]="submission.readOnly()">
  <p class="text-12 leading-18 font-medium text-text">
    {{ ('oppBulk.delete.text' | pluralKey: rows().length) | transloco: { n: rows().length } }}
  </p>

  <p class="text-12 leading-18 text-text-muted">
    {{ 'oppBulk.delete.bodyText' | transloco }}
  </p>

  <ui-field
    size="multiline"
    [label]="'oppBulk.delete.reason' | transloco"
    [for]="uid + '-reason'"
    [hint]="'oppBulk.delete.reasonHint' | transloco"
    [count]="reasonLength()"
    [max]="maxReasonLength"
    [error]="reasonError()"
  >
    <textarea
      [id]="uid + '-reason'"
      rows="2"
      [attr.maxlength]="maxReasonLength"
      class="w-full resize-none bg-transparent text-12 leading-18 text-text outline-none placeholder:text-text-placeholder"
      [value]="reason()"
      [attr.aria-invalid]="reasonError() ? 'true' : null"
      (input)="onReasonInput($event)"
    ></textarea>
  </ui-field>
  </fieldset>
</app-bulk-run-modal>
