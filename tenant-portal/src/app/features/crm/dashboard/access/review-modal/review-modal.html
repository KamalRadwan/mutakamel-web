<ui-modal
  size="form"
  icon="tablerUserShare"
  tile="bg-icon-violet"
  [title]="'access.review.title' | transloco"
  [subtitle]="resourceLabel()"
  [closeLabel]="'analytics.common.close' | transloco"
  [dismissable]="!submitting() && !cancelling()"
  (closed)="onModalClosed()"
>
  @if (review(); as rev) {
    <div class="flex flex-col gap-10">
      <div class="grid grid-cols-2 gap-x-10 gap-y-8 rounded-10 border border-border bg-surface-muted p-8">
        <ui-field [label]="'access.fields.resource' | transloco" [for]="uid + '-resource'" [hint]="'access.fields.resourceHint' | transloco">
          <input [id]="uid + '-resource'" class="w-full bg-transparent text-12 text-text outline-none" [value]="resourceLabel()" readonly />
        </ui-field>

        <ui-field [label]="'access.review.owner' | transloco" [for]="uid + '-current-owner'" [hint]="'access.review.ownerHint' | transloco">
          <input [id]="uid + '-current-owner'" class="w-full bg-transparent text-12 text-text outline-none" [value]="currentOwnerLabel()" readonly />
        </ui-field>

        <ui-field [label]="'access.review.triggerReason' | transloco" [for]="uid + '-trigger'" [hint]="'access.review.triggerReasonHint' | transloco">
          <input [id]="uid + '-trigger'" class="w-full bg-transparent text-12 text-text outline-none" [value]="'access.reviewReason.' + rev.triggerReason | transloco" readonly />
        </ui-field>

        <ui-field [label]="'access.review.status' | transloco" [for]="uid + '-status'" [hint]="'access.review.statusHint' | transloco">
          <input [id]="uid + '-status'" class="w-full bg-transparent text-12 text-text outline-none" [value]="'access.reviewStatus.' + rev.status | transloco" readonly />
        </ui-field>

        <ui-field [label]="'access.review.opened' | transloco" [for]="uid + '-opened'" [hint]="'access.review.openedHint' | transloco">
          <input [id]="uid + '-opened'" class="w-full bg-transparent text-12 text-text outline-none" [value]="openedText()" readonly />
        </ui-field>

        <ui-field [label]="'access.review.reviewUntil' | transloco" [for]="uid + '-until'" [hint]="'access.review.reviewUntilHint' | transloco">
          <input [id]="uid + '-until'" class="w-full bg-transparent text-12 text-text outline-none" [value]="reviewUntilText()" readonly />
        </ui-field>

        <ui-field size="multiline" class="col-span-2" [label]="'access.review.currentProposal' | transloco" [for]="uid + '-proposal'" [hint]="'access.review.currentProposalHint' | transloco">
          <textarea [id]="uid + '-proposal'" rows="3" class="w-full resize-none bg-transparent text-12 leading-18 text-text outline-none" [value]="proposalText()" readonly></textarea>
        </ui-field>
      </div>

      @if (isOpenReview()) {
        <div class="grid grid-cols-2 gap-x-10 gap-y-8">
          <ui-field
            size="bare"
            class="col-span-2"
            [label]="'access.review.proposedOwner' | transloco"
            [for]="uid + '-owner'"
            [hint]="'access.review.proposedOwnerHint' | transloco"
            [required]="true"
            [error]="ownerError()"
          >
            <div class="relative inline-flex w-full">
              <button
                #ownerTrigger
                type="button"
                [id]="uid + '-owner'"
                class="inline-flex h-field w-full cursor-pointer items-center justify-between gap-6 rounded-8 border bg-surface-field px-8 text-12 text-text outline-none transition-colors duration-fast disabled:cursor-not-allowed disabled:bg-neutral-soft disabled:text-text-placeholder"
                [class]="
                  ownerError()
                    ? 'border-danger-border ring-2 ring-danger-halo'
                    : ownerMenuOpen()
                      ? 'border-focus-ring ring-3 ring-focus-halo'
                      : 'border-border-field hover:border-border-field-hover focus-visible:border-focus-ring focus-visible:ring-3 focus-visible:ring-focus-halo'
                "
                aria-haspopup="listbox"
                [attr.aria-expanded]="ownerMenuOpen()"
                [attr.aria-label]="'access.review.proposedOwner' | transloco"
                [attr.aria-describedby]="
                  ownerError() ? uid + '-owner-hint ' + uid + '-owner-error' : uid + '-owner-hint'
                "
                [attr.aria-invalid]="ownerError() ? 'true' : null"
                [disabled]="readOnly() || ownersLoading() || owners().length === 0"
                (click)="toggleOwnerMenu()"
              >
                <span class="flex min-w-0 items-center gap-6">
                  @if (selectedOwner(); as owner) {
                    <span
                      class="inline-flex size-badge shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
                      aria-hidden="true"
                    >
                      {{ initials(personDisplayName(owner)) }}
                    </span>
                    <span class="truncate">{{ personDisplayName(owner) }}</span>
                  } @else {
                    <span class="truncate text-text-placeholder">
                      {{ 'access.review.proposedOwnerPlaceholder' | transloco }}
                    </span>
                  }
                </span>
                <span class="inline-flex shrink-0 text-text-muted">
                  <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
                </span>
              </button>

              @if (ownerMenuOpen()) {
                <div
                  #ownerPanel
                  class="fixed z-dropdown flex flex-col gap-4 rounded-10 border border-border bg-surface p-4 shadow-popover"
                  [class.invisible]="!ownerMenuPlaced()"
                  [style.top.px]="ownerMenuPlace().top"
                  [style.inset-inline-start.px]="ownerMenuPlace().start"
                  [style.width.px]="ownerMenuPlace().width"
                  [style.max-height.px]="ownerMenuPlace().maxHeight"
                  (keydown)="onOwnerPanelKeydown($event)"
                >
                  <div
                    class="flex h-field shrink-0 items-center gap-6 rounded-8 border border-border-field bg-surface-field px-8 focus-within:border-focus-ring focus-within:ring-3 focus-within:ring-focus-halo"
                  >
                    <ng-icon name="tablerSearch" size="14" class="shrink-0 text-text-muted" aria-hidden="true" />
                    <input
                      #ownerSearchInput
                      type="text"
                      class="min-w-0 flex-1 bg-transparent text-12 text-text outline-none placeholder:text-text-placeholder"
                      [value]="ownerSearch()"
                      [placeholder]="'access.review.searchOwner' | transloco"
                      [attr.aria-label]="'access.review.searchOwner' | transloco"
                      (input)="onOwnerSearchInput($event)"
                    />
                  </div>

                  <ul
                    role="listbox"
                    class="flex max-h-notif-list-max flex-col gap-2 overflow-y-auto"
                    [attr.aria-label]="'access.review.proposedOwner' | transloco"
                  >
                    @for (owner of filteredOwners(); track owner.id) {
                      <li role="option" [attr.aria-selected]="selectedOwnerId() === owner.id">
                        <button
                          type="button"
                          class="flex h-menu-item w-full cursor-pointer items-center justify-between gap-8 whitespace-nowrap rounded-6 px-8 text-12 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
                          [class]="
                            selectedOwnerId() === owner.id
                              ? 'bg-brand-soft text-on-brand-soft'
                              : 'text-text hover:bg-row-hover'
                          "
                          (click)="selectOwner(owner.id)"
                        >
                          <span class="flex min-w-0 items-center gap-6">
                            <span
                              class="inline-flex size-avatar shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
                              aria-hidden="true"
                            >
                              {{ initials(personDisplayName(owner)) }}
                            </span>
                            <span class="truncate">{{ personDisplayName(owner) }}</span>
                            <span class="truncate text-11 text-text-muted">{{ owner.email }}</span>
                          </span>
                          @if (selectedOwnerId() === owner.id) {
                            <ng-icon name="tablerCheck" size="14" class="shrink-0" aria-hidden="true" />
                          }
                        </button>
                      </li>
                    } @empty {
                      <li class="px-8 py-6 text-center text-12 text-text-muted">
                        {{ 'analytics.common.noResults' | transloco }}
                      </li>
                    }
                  </ul>
                </div>
              }
            </div>
          </ui-field>

          <ui-field
            size="multiline"
            class="col-span-2"
            [label]="'access.review.reason' | transloco"
            [for]="uid + '-reason'"
            [hint]="(isTransferAction() ? 'access.review.reasonHintTransfer' : 'access.review.reasonHintPropose') | transloco"
            [required]="true"
            [count]="reason().length"
            [max]="500"
            [error]="reasonError()"
          >
            <textarea
              [id]="uid + '-reason'"
              rows="3"
              class="w-full resize-none bg-transparent text-12 leading-18 text-text outline-none placeholder:text-text-placeholder"
              [readOnly]="readOnly()" [value]="reason()"
              [placeholder]="'access.review.reasonPlaceholder' | transloco"
              [attr.aria-invalid]="reasonError() ? 'true' : null"
              (input)="onReasonInput($event)"
            ></textarea>
          </ui-field>
        </div>
      }
    </div>
  }

  <ng-container modal-footer>
    @if (isOpenReview()) {
      <button
        type="button"
        uiButton
        variant="primary"
        [loading]="submitting()"
        [disabled]="cancelling() || readOnly()"
        (click)="submitPrimary()"
      >
        {{ (isTransferAction() ? 'access.review.transferNow' : 'access.review.propose') | transloco }}
      </button>
      <button
        type="button"
        uiButton
        variant="secondary"
        [loading]="cancelling()"
        [disabled]="submitting() || readOnly()"
        (click)="confirmCancelReview()"
      >
        {{ 'access.review.cancelReview' | transloco }}
      </button>
    }
    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="submitting() || cancelling()"
      (click)="close()"
    >
      {{ 'analytics.common.close' | transloco }}
    </button>
  </ng-container>
</ui-modal>

<ui-confirm-dialog
  #cancelConfirm
  tone="warning"
  [title]="'access.confirmCancelReview.title' | transloco"
  [text]="'access.confirmCancelReview.text' | transloco"
  [confirmLabel]="'access.confirmCancelReview.confirm' | transloco"
  [cancelLabel]="'analytics.common.close' | transloco"
/>

<ui-conflict-dialog [(open)]="conflictOpen" (reload)="resolveConflict(true)" (keepEditing)="resolveConflict(false)" />
