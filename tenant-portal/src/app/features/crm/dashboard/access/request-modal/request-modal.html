<ui-modal
  size="form"
  icon="tablerKey"
  tile="bg-icon-teal"
  [title]="'access.request.title' | transloco"
  [closeLabel]="'analytics.common.close' | transloco"
  [dismissable]="!submitting()"
  (closed)="onModalClosed()"
>
  <div class="grid grid-cols-2 gap-x-10 gap-y-8">
    <ui-field class="col-span-2" [label]="'access.fields.resource' | transloco" [for]="uid + '-resource'" [hint]="'access.fields.resourceHint' | transloco" [error]="resourceError()">
      <input [id]="uid + '-resource'" class="w-full bg-transparent text-12 text-text outline-none" [value]="resourceId()" readonly />
    </ui-field>
    <ui-field
      size="bare"
      [label]="'access.request.level' | transloco"
      [for]="uid + '-level'"
      [hint]="'access.request.levelHint' | transloco"
      [required]="true"
      [error]="levelError()"
    >
      <div>
        <ui-segmented
          [id]="uid + '-level'"
          [options]="levelOptions()"
          [label]="'access.request.level' | transloco"
          [describedBy]="
            levelError() ? uid + '-level-hint ' + uid + '-level-error' : uid + '-level-hint'
          "
          [value]="requestedLevel()"
          (valueChange)="onLevelChange($event)"
        />
      </div>
    </ui-field>

    <ui-field
      size="bare"
      [label]="'access.request.expires' | transloco"
      [for]="uid + '-expires'"
      [hint]="'access.request.expiresHint' | transloco"
      [error]="expiresError()"
    >
      <div class="flex items-center gap-4">
        <ui-date-field
          class="min-w-0 flex-1"
          [id]="uid + '-expires'"
          [ariaLabel]="'access.request.expires' | transloco"
          [describedBy]="
            expiresError()
              ? uid + '-expires-hint ' + uid + '-expires-error'
              : uid + '-expires-hint'
          "
          [min]="minExpiryDate"
          [placeholder]="'access.fields.noExpiry' | transloco"
          [todayLabel]="'access.date.today' | transloco"
          [prevMonthLabel]="'access.date.prevMonth' | transloco"
          [nextMonthLabel]="'access.date.nextMonth' | transloco"
          [invalid]="!!expiresError()"
          [disabled]="readOnly()"
          [value]="requestedExpiresAt()"
          (valueChange)="onExpiresChange($event)"
        />
        @if (requestedExpiresAt()) {
          <button
            type="button"
            class="inline-flex size-btn-h-sm shrink-0 cursor-pointer items-center justify-center rounded-6 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
            [attr.aria-label]="'access.actions.clearDate' | transloco"
            [title]="'access.actions.clearDate' | transloco"
            (click)="clearExpires()"
          >
            <ng-icon name="tablerX" size="14" aria-hidden="true" />
          </button>
        }
      </div>
    </ui-field>

    <ui-field
      size="multiline"
      class="col-span-2"
      [label]="'access.request.purpose' | transloco"
      [for]="uid + '-purpose'"
      [hint]="'access.request.purposeHint' | transloco"
      [required]="true"
      [count]="purpose().length"
      [max]="250"
      [error]="purposeError()"
    >
      <textarea
        [id]="uid + '-purpose'"
        rows="3"
        class="w-full resize-none bg-transparent text-12 leading-18 text-text outline-none placeholder:text-text-placeholder"
        [readOnly]="readOnly()"
        [value]="purpose()"
        [placeholder]="'access.request.purposePlaceholder' | transloco"
        [attr.aria-invalid]="purposeError() ? 'true' : null"
        (input)="onPurposeInput($event)"
      ></textarea>
    </ui-field>
  </div>

  <ng-container modal-footer>
    <button type="button" uiButton variant="primary" [loading]="submitting()" [disabled]="readOnly()" (click)="submit()">
      {{ 'access.request.send' | transloco }}
    </button>
    <button type="button" uiButton variant="secondary" [disabled]="submitting()" (click)="close()">
      {{ 'analytics.common.cancel' | transloco }}
    </button>
  </ng-container>
</ui-modal>
