<ui-modal size="wide" [title]="'dashFilters.why' | transloco" icon="tablerHelpCircle" tile="bg-icon-blue"
  [closeLabel]="'dashFilters.close' | transloco" (closed)="onClosed()">
  @if (loading()) {
    <div class="grid grid-cols-3 gap-x-10 gap-y-8">
      @for (row of skeletonRows; track row) {
        <span class="h-skeleton-line rounded-6 bg-neutral-soft" aria-hidden="true"></span>
      }
    </div>
  } @else if (readError(); as error) {
    <ui-full-state [kind]="error.kind" [title]="'analytics.common.loadFailed' | transloco" [text]="error.message"
      [actionLabel]="(error.kind === 'provisioning' && canViewReadiness ? 'dashFilters.openReadiness' : 'analytics.common.retry') | transloco"
      (action)="onErrorAction()" />
  } @else {
    <div class="flex flex-col gap-12">
      <div class="grid grid-cols-3 gap-x-10 gap-y-8">
        <ui-field [for]="uid + '-access'" [label]="'dashFilters.yourAccess' | transloco" [hint]="'dashFilters.yourAccessHint' | transloco">
          <input [id]="uid + '-access'" readonly [value]="accessText()" />
        </ui-field>
        <ui-field [for]="uid + '-org'" [label]="'dashFilters.companyBranch' | transloco" [hint]="'dashFilters.companyBranchHint' | transloco">
          <input [id]="uid + '-org'" readonly [value]="organizationText()" />
        </ui-field>
        <ui-field [for]="uid + '-period'" [label]="'dashFilters.periodLabel' | transloco" [hint]="'dashFilters.periodLabelHint' | transloco">
          <input [id]="uid + '-period'" readonly [value]="periodText()" />
        </ui-field>
        <ui-field [for]="uid + '-as-of'" [label]="'dashFilters.dataAsOf' | transloco" [hint]="'dashFilters.dataAsOfHint' | transloco">
          <input [id]="uid + '-as-of'" readonly [value]="asOfText()" />
        </ui-field>
      </div>
      <ui-field size="bare" [for]="uid + '-receipts'" [label]="'dashFilters.receipts' | transloco" [hint]="'dashFilters.receiptsHint' | transloco">
        <ui-data-table [id]="uid + '-receipts'" [attr.aria-describedby]="uid + '-receipts-hint'" [columns]="columns()"
          [rows]="receipts()" [rowKey]="rowKey" [label]="'dashFilters.receipts' | transloco" [emptyText]="'dashFilters.receiptsEmpty' | transloco">
          <ng-template uiCell="metricKey" let-row>{{ metricName(row.metricKey) }}</ng-template>
          <ng-template uiCell="resultStatus" let-row>{{ ('dashFilters.receiptStatus.' + row.resultStatus) | transloco }}</ng-template>
          <ng-template uiCell="executedAt" let-row>{{ executionTime(row.executedAt) }}</ng-template>
          <ng-template uiCell="explain" let-row>
            <button uiButton variant="secondary" size="small" (click)="openExplanation(row.id)">{{ 'dashFilters.explainTitle' | transloco }}</button>
          </ng-template>
        </ui-data-table>
      </ui-field>
    </div>
  }
  <ng-container modal-footer>
    <button uiButton variant="secondary" (click)="close()">{{ 'dashFilters.close' | transloco }}</button>
    <span class="flex-1" aria-hidden="true"></span>
    @if (canViewReadiness) {
      <button uiButton variant="ghost" size="small" (click)="openReadiness()">{{ 'dashFilters.dataReadiness' | transloco }}</button>
    }
  </ng-container>
</ui-modal>
<app-explain-modal />
