@if (unavailable()) {
  <ui-field [label]="'leadForm.sections.custom' | transloco" [hint]="unavailableMessage()">
    <input type="text" disabled [value]="unavailableMessage()" class="w-full bg-transparent text-12 text-text-muted outline-none" />
  </ui-field>
} @else {
<app-record-custom-fields
  [fields]="fields()"
  [values]="draft().customFields"
  [layout]="layout()"
  [errors]="errors()"
  [readonly]="readonly()"
  [mode]="mode()"
  [scope]="scope()"
  [stacked]="stacked()"
  [countries]="countries()"
  (valuesChange)="onValuesChange($event)"
/>

}
