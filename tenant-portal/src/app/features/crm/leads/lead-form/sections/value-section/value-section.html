<app-money-field
  [currencies]="currencyOptions()"
  [integerDigits]="limits.valueIntegerDigits"
  [decimals]="limits.valueDecimals"
  [amount]="draft().expectedValue || null"
  [currency]="draft().currencyCode"
  [readonly]="readonly() || !lookups.currencies().length"
  [errors]="moneyErrors()"
  labelKey="leadSide.value"
  [hintKey]="lookups.currencies().length ? 'leadSide.valueHint' : 'leadForm.write.catalogueDenied'"
  (amountChange)="onAmountChange($event)"
  (currencyChange)="onCurrencyChange($event)"
/>
