<app-record-modal-frame
  [open]="isOpen()"
  (openChange)="onOpenChange($event)"
  [mode]="mode()"
  typeIcon="tablerUserPlus"
  typeTile="bg-icon-green"
  [typeTitle]="(mode() === 'create' ? 'leadModal.newTitle' : 'leadModal.title') | transloco"
  [subtitle]="displayName()"
  [position]="navPosition()"
  [dirty]="dirty()"
  [saving]="saving()"
  [deleting]="deleting()"
  [loading]="loading()"
  [updating]="instantUpdating() || loading()"
  [actionsDisabled]="loading() || loadFailed()"
  [canSave]="canEdit()"
  [saveEnabled]="dirty() || hasUnsavedContact()"
  [canDelete]="canDelete()"
  [createLabel]="'leadModal.footer.create' | transloco"
  [ariaLabel]="mode() === 'create' ? ('leadModal.newTitle' | transloco) : deleteLeadName()"
  [dismissable]="!anyGuardBusy() && !isSwitchingType()"
  [prevLabel]="'leadModal.nav.prev' | transloco"
  [nextLabel]="'leadModal.nav.next' | transloco"
  (prev)="goPrev()"
  (next)="goNext()"
  (requestClose)="requestClose()"
  (save)="save(false)"
  (saveAndNew)="save(true)"
  (fullPage)="continueInFullPage()"
  (undo)="undoChanges()"
  (delete)="confirmDelete()"
>
  @if (mode() === 'edit' && !loading() && !loadFailed() && detail(); as currentLead) {
    @if (currentLead.id === leadId()) {
      <app-record-related-badges
        headerRelated
        layout="modal"
        recordType="LEAD"
        [recordId]="currentLead.id"
        [branchId]="currentLead.branchId"
        [partyLabel]="displayName()"
        (badgeClick)="onRelatedBadgeClick($event)"
      />
    }
  }

  @if (loading() || !scopesReady()) {
    <div modalMain class="flex flex-col gap-y-10">
      <div class="flex flex-col gap-8">
        <div class="h-field w-1/3 animate-pulse rounded-8 bg-neutral-soft"></div>
        <div class="grid grid-cols-3 gap-x-10 gap-y-8">
          <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
          <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
          <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-x-10 gap-y-8">
        <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
        <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      </div>
      <div class="flex flex-col gap-6 rounded-10 border border-border bg-surface p-8">
        <div class="h-skeleton-line w-1/4 animate-pulse rounded-6 bg-neutral-soft"></div>
        <div class="grid grid-cols-2 gap-x-10 gap-y-8">
          <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
          <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
        </div>
      </div>
    </div>
  } @else if (loadFailed()) {
    <div modalMain class="flex flex-1 flex-col items-center justify-center gap-8 p-16 text-center">
      <span class="inline-flex size-icon-tile-lg items-center justify-center rounded-8 bg-icon-red text-on-icon">
        <ng-icon name="tablerCloudOff" size="18" aria-hidden="true" />
      </span>
      <p class="text-12 leading-18 text-text-muted">{{ 'leadModal.loadFailed' | transloco }}</p>
      <button type="button" uiButton variant="primary" (click)="retryLoad()">
        {{ 'recordModal.retry' | transloco }}
      </button>
    </div>
  } @else {
    <app-lead-form
      modalMain
      class="h-full min-h-0 flex-1"
      layout="modal"
      [mode]="mode()"
      [readonly]="isReadonly()"
      [errors]="errors()"
      [leadId]="leadId()"
      [revision]="formRevision()"
      [saveContacts]="saveContactsBound"
      [excludePartyId]="detail()?.partyId ?? null"
      [stages]="headerStages()"
      [stageId]="currentStageId()"
      [updating]="instantUpdating() || loading() || saving() || deleting()"
      [draft]="draft()"
      (draftChange)="onFormDraftChange($event)"
      (rate)="onRate($event)"
      (recolor)="onRecolor($event)"
      (moveStage)="onMoveStage($event)"
      (openLead)="navigateTo($event)"
      (submitRequest)="save(false)"
    />
  }

  @if (loading() || !scopesReady()) {
    <div modalAside class="flex flex-col gap-y-8">
      <div class="h-skeleton-line w-1/2 animate-pulse rounded-6 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      <div class="grid grid-cols-2 gap-x-10">
        <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
        <div class="h-field animate-pulse rounded-8 bg-neutral-soft"></div>
      </div>
    </div>
  }
</app-record-modal-frame>

<ui-unsaved-dialog
  #unsavedDialog
  [title]="'recordModal.unsaved.title' | transloco"
  [text]="'recordModal.unsaved.text' | transloco"
  [saveLabel]="'recordModal.unsaved.save' | transloco"
  [discardLabel]="'recordModal.unsaved.discard' | transloco"
  [cancelLabel]="'recordModal.unsaved.cancel' | transloco"
/>

<ui-conflict-dialog
  [open]="conflictOpen()"
  (openChange)="onConflictOpenChange($event)"
  [recordLabel]="displayName()"
  (reload)="onConflictChoice('reload')"
  (keepEditing)="onConflictChoice('keep')"
/>

<div #deleteDialogWrap (keydown.escape)="onDeleteDialogEscape($event)" (cancel)="onDeleteDialogEscape($event)">
  <ui-confirm-dialog
    #deleteDialog
    tone="danger"
    [title]="'leadModal.delete.title' | transloco"
    [text]="'leadModal.delete.text' | transloco: { name: deleteLeadName() }"
    [confirmLabel]="'leadModal.delete.confirm' | transloco"
    [cancelLabel]="'recordModal.unsaved.cancel' | transloco"
  />
</div>
