@if (failed()) {
  <ui-full-state [kind]="errorState().kind" [title]="'leads.loadFailed' | transloco"
    [text]="errorState().message + (errorState().correlationId ? ' · ' + errorState().correlationId : '')"
    [actionLabel]="'leads.retry' | transloco" (action)="refresh()" />
} @else {

<app-record-board
  [lanes]="boardLanes()"
  [itemTemplate]="leadCardTpl"
  [idOf]="leadId"
  [canDrag]="canDragLead"
  [loading]="loading()"
  [collapseStorageKey]="collapseStorageKey"
  [labels]="boardLabels()"
  [laneHeaderEnd]="laneRetry"
  (loadMore)="onLoadMore($event)"
  (create)="create.emit($event)"
  (move)="onMove($event)"
/>
}

<ng-template #laneRetry let-lane>
  @if (laneErrors()[lane.id]) {
    <button uiButton size="small" variant="ghost" [disabled]="loadingMore() !== null" (click)="onLoadMore(lane.id)">
      {{ 'leads.retry' | transloco }}
    </button>
  }
</ng-template>

<ng-template #leadCardTpl let-lead let-lane="lane">
  <app-lead-card
    [lead]="lead"
    [stages]="stages()"
    [editable]="writes.canUpdate(lead)"
    [deletable]="writes.canDelete(lead)"
    [expanded]="openCards()[lane.id] === lead.id"
    (expandedChange)="setExpanded(lane.id, lead.id, $event)"
    (moveTo)="move(lead.id, $event)"
    (rate)="rate(lead, $event)"
    (recolor)="recolor(lead, $event)"
    (delete)="remove(lead)"
    (view)="view.emit(lead)"
    (activities)="activities.emit(lead)"
  />
</ng-template>

<ui-confirm-dialog
  class="absolute"
  [title]="'leads.delete.title' | transloco"
  [text]="'leads.delete.text' | transloco: { name: deletingName() }"
  [confirmLabel]="'common.delete' | transloco"
  [cancelLabel]="'common.cancel' | transloco"
/>

<app-lead-disqualify (writeBlocked)="writes.readOnly.set(true)" />
<ui-conflict-dialog [(open)]="writes.conflictOpen" (reload)="writes.reloadConflict()" (keepEditing)="writes.keepConflict()" />
