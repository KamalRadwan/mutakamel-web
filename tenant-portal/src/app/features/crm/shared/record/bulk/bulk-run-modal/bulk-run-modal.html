<ui-modal
  [size]="size()"
  [icon]="icon()"
  [tile]="tile()"
  [title]="title()"
  [closeLabel]="resolvedCancelLabel()"
  [dismissable]="resolvedDismissable()"
  (closed)="onClosed()"
>
  <span
    modal-header-end
    class="inline-flex h-badge shrink-0 items-center rounded-8 px-8 text-12 font-medium whitespace-nowrap"
    [class]="tone() === 'danger' ? 'bg-danger-soft text-on-danger-soft' : 'bg-brand-soft text-on-brand-soft'"
  >
    {{ resolvedSummary() }}
  </span>

  @if (resolving()) {
    <div class="flex items-center justify-center gap-8 py-16 text-12 text-text-muted">
      <ng-icon name="tablerLoader2" size="16" class="animate-spin text-accent" aria-hidden="true" />
      <span>{{ 'recordBulk.run.resolving' | transloco }}</span>
    </div>
  } @else {
    <div class="flex flex-col gap-10">
      <ng-content />

      @if (needsTypedConfirm()) {
        <ui-field
          [label]="resolvedTypedConfirmLabel()"
          [for]="uid + '-confirm'"
          [hint]="resolvedTypedConfirmHint()"
          [required]="true"
        >
          <input
            [id]="uid + '-confirm'"
            type="text"
            autocomplete="off"
            aria-required="true"
            class="w-full bg-transparent text-12 text-text outline-none placeholder:text-text-placeholder"
            [value]="confirmText()"
            (input)="onConfirmInput($event)"
          />
        </ui-field>
      }
    </div>
  }

  <ng-container modal-footer>
    <button
      type="button"
      uiButton
      [variant]="tone() === 'danger' ? 'danger' : 'primary'"
      [loading]="submitting()"
      [disabled]="submitDisabled()"
      (click)="onSubmit()"
    >
      {{ resolvedSubmitLabel() }}
    </button>
    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="submitting()"
      (click)="onCancel()"
    >
      {{ resolvedCancelLabel() }}
    </button>
  </ng-container>
</ui-modal>
