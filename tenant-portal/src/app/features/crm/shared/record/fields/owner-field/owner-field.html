<ui-field
  size="bare"
  [label]="'recordFields.owner.label' | transloco"
  [for]="uid + '-owner'"
  [hint]="(selfOnly() ? 'recordFields.owner.selfOnlyHint' : 'recordFields.owner.hint') | transloco"
  [error]="error()"
>
  @if (isReadonly()) {
    <div
      class="flex h-field w-full items-center gap-6 rounded-8 border bg-surface-field px-8 text-12 text-text"
      [class]="error() ? 'border-danger-border ring-2 ring-danger-halo' : 'border-border-field'"
    >
      @if (selectedOwner(); as owner) {
        @if (owner.avatarUrl) {
          <img [src]="owner.avatarUrl" alt="" class="size-badge shrink-0 rounded-full object-cover" />
        } @else {
          <span
            class="inline-flex size-badge shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
            aria-hidden="true"
          >
            {{ initialsOf(owner.name) }}
          </span>
        }
      }
      <input
        [id]="uid + '-owner'"
        type="text"
        readonly
        [value]="selectedOwner()?.name || '—'"
        [attr.aria-invalid]="error() ? 'true' : null"
        class="w-full bg-transparent text-12 text-text outline-none"
      />
    </div>
  } @else {
    <button
      #trigger
      type="button"
      [id]="uid + '-owner'"
      class="inline-flex h-field w-full cursor-pointer items-center justify-between gap-6 rounded-8 border bg-surface-field px-8 text-12 text-text outline-none transition-colors duration-fast"
      [class]="
        error()
          ? 'border-danger-border ring-2 ring-danger-halo'
          : open()
            ? 'border-focus-ring ring-3 ring-focus-halo'
            : 'border-border-field hover:border-border-field-hover focus-visible:border-focus-ring focus-visible:ring-3 focus-visible:ring-focus-halo'
      "
      aria-haspopup="listbox"
      [attr.aria-expanded]="open()"
      [attr.aria-label]="'recordFields.owner.label' | transloco"
      [attr.aria-invalid]="error() ? 'true' : null"
      (click)="toggle()"
    >
      <span class="flex min-w-0 items-center gap-6">
        @if (selectedOwner(); as owner) {
          @if (owner.avatarUrl) {
            <img [src]="owner.avatarUrl" alt="" class="size-badge shrink-0 rounded-full object-cover" />
          } @else {
            <span
              class="inline-flex size-badge shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
              aria-hidden="true"
            >
              {{ initialsOf(owner.name) }}
            </span>
          }
          <span class="truncate">{{ owner.name }}</span>
        } @else if (allowSelfDefault() && !ownerId()) {
          <span
            class="inline-flex size-badge shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
            aria-hidden="true"
          >
            {{ currentUser.initials() }}
          </span>
          <span class="truncate">{{ 'recordFields.owner.me' | transloco }}</span>
        } @else {
          <span class="truncate text-text-muted">—</span>
        }
      </span>
      <span class="inline-flex shrink-0 text-text-muted">
        <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
      </span>
    </button>
  }
</ui-field>

@if (open()) {
  <ul
    #menuList
    role="listbox"
    (keydown)="onMenuKeydown($event)"
    class="fixed z-dropdown flex max-h-notif-list-max flex-col gap-2 overflow-y-auto rounded-10 border border-border bg-surface p-4 shadow-popover"
    [class.invisible]="!placed()"
    [style.top.px]="place().top"
    [style.inset-inline-start.px]="place().start"
    [style.min-width.px]="place().width"
    [style.max-height.px]="place().maxHeight"
    [attr.aria-label]="'recordFields.owner.label' | transloco"
  >
    @if (allowSelfDefault()) {
      <li role="option" [attr.aria-selected]="ownerId() === null">
        <button
          type="button"
          class="flex h-menu-item w-full cursor-pointer items-center justify-between gap-8 whitespace-nowrap rounded-6 px-8 text-12 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          [class]="ownerId() === null ? 'bg-brand-soft text-on-brand-soft' : 'text-text hover:bg-row-hover'"
          (click)="select(null)"
        >
          <span class="flex min-w-0 items-center gap-6">
            <span
              class="inline-flex size-avatar shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
              aria-hidden="true"
            >
              {{ currentUser.initials() }}
            </span>
            <span class="truncate">{{ 'recordFields.owner.me' | transloco }}</span>
          </span>
          @if (ownerId() === null) {
            <ng-icon name="tablerCheck" size="14" class="shrink-0" aria-hidden="true" />
          }
        </button>
      </li>
    }
    @for (owner of owners(); track owner.userId) {
      <li role="option" [attr.aria-selected]="ownerId() === owner.userId">
        <button
          type="button"
          class="flex h-menu-item w-full cursor-pointer items-center justify-between gap-8 whitespace-nowrap rounded-6 px-8 text-12 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          [class]="ownerId() === owner.userId ? 'bg-brand-soft text-on-brand-soft' : 'text-text hover:bg-row-hover'"
          (click)="select(owner.userId)"
        >
          <span class="flex min-w-0 items-center gap-6">
            @if (owner.avatarUrl) {
              <img [src]="owner.avatarUrl" alt="" class="size-avatar shrink-0 rounded-full object-cover" />
            } @else {
              <span
                class="inline-flex size-avatar shrink-0 items-center justify-center rounded-full bg-icon-blue text-11 font-medium text-on-icon"
                aria-hidden="true"
              >
                {{ initialsOf(owner.name) }}
              </span>
            }
            <span class="truncate">{{ owner.name }}</span>
          </span>
          @if (ownerId() === owner.userId) {
            <ng-icon name="tablerCheck" size="14" class="shrink-0" aria-hidden="true" />
          }
        </button>
      </li>
    }
  </ul>
}
