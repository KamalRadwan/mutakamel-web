@if (showCompany()) {
  @let companyErr = companyError();
  <ui-field
    size="bare"
    [label]="'recordFields.scope.company' | transloco"
    [for]="uid + '-company'"
    [hint]="'recordFields.scope.companyHint' | transloco"
    [required]="!locked()"
    [error]="companyErr"
  >
    @if (!locked()) {
      <div [attr.aria-invalid]="companyErr ? 'true' : null">
        <ui-dropdown
          class="w-full"
          size="field"
          [id]="uid + '-company'"
          [options]="companyOptions()"
          [value]="companyId() ?? ''"
          [disabled]="companyOptions().length === 0"
          [label]="'recordFields.scope.company' | transloco"
          (valueChange)="onCompanySelect($event)"
        />
      </div>
    } @else {
      <div
        class="flex h-field w-full items-center rounded-8 border bg-surface-field px-8 text-12 text-text"
        [class]="companyErr ? 'border-danger-border ring-2 ring-danger-halo' : 'border-border-field'"
      >
        <input
          [id]="uid + '-company'"
          type="text"
          readonly
          [value]="companyLabel() || '—'"
          [attr.aria-invalid]="companyErr ? 'true' : null"
          class="w-full bg-transparent text-12 text-text outline-none"
        />
      </div>
    }
  </ui-field>
}
