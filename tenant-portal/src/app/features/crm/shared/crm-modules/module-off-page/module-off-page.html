<span class="inline-flex size-icon-tile-lg items-center justify-center rounded-8 bg-icon-gray text-on-icon">
  <ng-icon [name]="icon()" size="18" aria-hidden="true" />
</span>

<h1 class="text-13 leading-18 font-medium text-text">
  {{ ('crmModules.' + module() + '.title') | transloco }}
</h1>

<p class="text-12 leading-18 text-text-muted">
  {{ ('crmModules.' + module() + '.text') | transloco: { company: companyName() } }}
</p>

@if (canManageSettings) {
  <a uiButton routerLink="/crm/settings/general">{{ 'crmModules.openSettings' | transloco }}</a>
}
