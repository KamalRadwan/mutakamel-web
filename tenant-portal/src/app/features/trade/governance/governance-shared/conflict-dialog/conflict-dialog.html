<ui-modal
  size="confirm"
  icon="tablerAlertTriangle"
  tile="bg-icon-orange"
  [title]="title() || ('governance.conflict.title' | transloco)"
  [closeLabel]="'governance.common.close' | transloco"
  [dismissable]="false"
  (closed)="onModalClosed()"
>
  <p class="text-12 leading-18 text-text-muted">
    {{ text() || ('governance.conflict.text' | transloco) }}
  </p>

  <button
    modal-footer
    type="button"
    uiButton
    variant="primary"
    (click)="chooseReload()"
  >
    {{ reloadLabel() || ('governance.conflict.reload' | transloco) }}
  </button>

  <button
    modal-footer
    type="button"
    uiButton
    variant="secondary"
    (click)="chooseKeep()"
  >
    {{ keepLabel() || ('governance.conflict.keep' | transloco) }}
  </button>
</ui-modal>
