<ui-modal
  size="confirm"
  [icon]="tone() === 'danger' ? 'tablerX' : 'tablerArrowBackUp'"
  [tile]="tone() === 'danger' ? 'bg-icon-red' : 'bg-icon-blue'"
  [title]="title()"
  [closeLabel]="'governance.common.close' | transloco"
  [dismissable]="tone() !== 'danger' && !loading()"
  (closed)="onModalClosed()"
>
  <div class="flex flex-col gap-10">
    @if (text()) {
      <p class="text-12 leading-18 text-text-muted">{{ text() }}</p>
    }

    @if (dialogOpen()) {
      <app-trade-reason-picker
        [kind]="kind()"
        [idPrefix]="uid"
        [disabled]="loading()"
        [showErrors]="submitted()"
        [(value)]="choice"
      />
    }
  </div>

  <div modal-footer class="flex flex-1 items-center gap-8">
    <button
      type="button"
      uiButton
      [variant]="tone() === 'danger' ? 'danger' : 'primary'"
      [loading]="loading()"
      [disabled]="confirmDisabled()"
      (click)="confirm()"
    >
      {{ confirmLabel() || ('governance.reason.confirm' | transloco) }}
    </button>

    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="loading()"
      (click)="cancel()"
    >
      {{ 'governance.common.cancel' | transloco }}
    </button>
  </div>
</ui-modal>
