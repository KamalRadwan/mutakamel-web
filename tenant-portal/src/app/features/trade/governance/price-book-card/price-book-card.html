@let b = book();

<article
  role="button"
  tabindex="0"
  class="flex h-full cursor-pointer items-center gap-8 rounded-10 border border-border bg-surface p-8 text-start shadow-popover outline-none transition-colors duration-fast hover:bg-row-hover focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
  [attr.aria-label]="displayName()"
  (click)="open.emit(b)"
  (keydown)="onCardKeydown($event)"
>
  <span
    class="inline-flex size-icon-tile shrink-0 items-center justify-center rounded-8 text-on-icon"
    [class]="b.status === 'INACTIVE' ? 'bg-icon-gray' : 'bg-icon-blue'"
    aria-hidden="true"
  >
    <ng-icon name="tablerBook" size="15" />
  </span>

  <div class="flex min-w-0 flex-1 flex-col gap-4">
    <div class="flex min-w-0 items-center gap-6">
      <span dir="auto" class="min-w-0 truncate text-13 leading-18 font-medium text-text">
        {{ displayName() }}
      </span>

      @if (b.isCompanyDefault) {
        <span
          class="inline-flex shrink-0 items-center text-warning-text"
          [title]="'priceBooks.companyDefault' | transloco"
          [attr.aria-label]="'priceBooks.companyDefault' | transloco"
        >
          <ng-icon name="tablerStarFill" size="14" aria-hidden="true" />
        </span>
      }

      <app-version-status-badge
        class="ms-auto"
        module="price"
        [status]="governanceState()"
        [label]="'governance.governanceState.' + governanceState() | transloco"
      />
    </div>

    <div class="flex min-w-0 flex-wrap items-center gap-6 text-12 leading-16 text-text-muted">
      <bdi dir="ltr" class="truncate tabular-nums">{{ b.code }} · {{ b.currencyCode }}</bdi>
      <span
        class="inline-flex h-chip shrink-0 items-center rounded-6 bg-neutral-soft px-6 text-11 font-medium text-on-neutral-soft"
      >
        {{ 'priceBooks.purpose.' + b.purpose | transloco }}
      </span>
    </div>

    <p class="mt-auto text-11 leading-16 text-text-muted tabular-nums">
      {{ 'priceBooks.card.summary' | transloco: { lines: linesCount(), promotions: promotionsCount() } }}
    </p>
  </div>

  <div
    class="shrink-0"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <ui-actions-menu
      [items]="actions()"
      [label]="'priceBooks.table.actions' | transloco"
      (selected)="action.emit($event)"
    />
  </div>
</article>
