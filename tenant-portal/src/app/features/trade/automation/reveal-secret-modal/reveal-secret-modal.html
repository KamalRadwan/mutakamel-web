<dialog
  #dialog
  class="z-modal m-auto w-modal-confirm rounded-14 border border-border bg-surface p-0 text-text shadow-modal backdrop:bg-overlay"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
  (keydown.escape)="onEscape($event)"
  (close)="onNativeClose()"
>
  <div class="flex flex-col">
    <header class="flex items-center gap-8 border-b border-border px-10 py-8">
      <span class="inline-flex size-icon-tile shrink-0 items-center justify-center rounded-8 bg-icon-navy text-on-icon">
        <ng-icon name="tablerKey" size="15" aria-hidden="true" />
      </span>
      <h2 [id]="titleId" class="min-w-0 flex-1 truncate text-15 leading-22 font-medium text-text">
        {{ 'webhooks.reveal.title' | transloco }}
      </h2>
      <button
        type="button"
        class="inline-flex size-btn shrink-0 items-center justify-center rounded-8 text-text-muted outline-none transition-colors duration-fast ease-enter focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
        [class]="canClose() ? 'cursor-pointer hover:bg-neutral-soft active:bg-border' : 'cursor-not-allowed opacity-drag-source'"
        [disabled]="!canClose()"
        [attr.aria-label]="'webhooks.common.close' | transloco"
        (click)="attemptClose()"
      >
        <ng-icon name="tablerX" size="15" aria-hidden="true" />
      </button>
    </header>

    <div class="flex flex-col gap-10 p-10">
      @if (loading()) {
        <div class="flex items-center gap-8 py-8 text-12 leading-18 text-text-muted" aria-busy="true">
          <ng-icon name="tablerLoader2" size="14" class="animate-spin text-accent" aria-hidden="true" />
          <span>{{ 'webhooks.reveal.loading' | transloco }}</span>
        </div>
      } @else if (failed()) {
        <div class="flex items-center gap-8 rounded-10 border border-border bg-surface-muted p-10 text-12 leading-18 text-danger-text">
          <ng-icon name="tablerAlertTriangle" size="15" class="shrink-0" aria-hidden="true" />
          <span>{{ 'webhooks.reveal.loadError' | transloco }}</span>
        </div>
      } @else {
        <ui-field
          [for]="uid + '-secret'"
          [label]="'webhooks.reveal.fieldLabel' | transloco"
          [hint]="'webhooks.reveal.fieldHint' | transloco"
        >
          <input
            [id]="uid + '-secret'"
            type="text"
            dir="ltr"
            readonly
            class="h-full min-w-0 flex-1 bg-transparent text-12 text-text tabular-nums outline-none"
            [value]="secretValue()"
          />
          <button
            type="button"
            class="inline-flex size-chip shrink-0 cursor-pointer items-center justify-center rounded-6 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
            [attr.aria-label]="'webhooks.common.copy' | transloco"
            [title]="'webhooks.common.copy' | transloco"
            (click)="copySecret()"
          >
            <ng-icon [name]="copied() ? 'tablerCheck' : 'tablerCopy'" size="14" aria-hidden="true" />
          </button>
        </ui-field>

        <p class="text-12 leading-18 text-text-muted">
          {{ 'webhooks.reveal.warning' | transloco }}
        </p>

        <ui-field
          size="bare"
          [label]="'webhooks.reveal.storedLabel' | transloco"
          [for]="uid + '-stored'"
          [hint]="'webhooks.reveal.storedHint' | transloco"
        >
          <div class="flex min-h-field items-center">
            <ui-checkbox [(checked)]="stored">
              <span>{{ 'webhooks.reveal.storedCheck' | transloco }}</span>
            </ui-checkbox>
          </div>
        </ui-field>
      }
    </div>

    <footer class="flex items-center gap-8 rounded-b-14 border-t border-border bg-surface-muted px-10 py-8">
      <button
        type="button"
        uiButton
        variant="primary"
        [disabled]="!canClose()"
        (click)="attemptClose()"
      >
        {{ 'webhooks.common.close' | transloco }}
      </button>
    </footer>
  </div>
</dialog>
