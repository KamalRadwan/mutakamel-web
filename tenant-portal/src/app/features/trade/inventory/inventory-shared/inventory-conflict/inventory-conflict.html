<ui-modal
  #dialog
  size="alert"
  icon="tablerAlertTriangle"
  tile="bg-icon-orange"
  [title]="'tradeInventory.conflict.title' | transloco"
  [closeLabel]="'tradeInventory.common.close' | transloco"
  (closed)="onModalClosed()"
>
  <p class="text-12 leading-18 text-text-muted">{{ 'tradeInventory.conflict.text' | transloco }}</p>

  <div modal-footer class="flex flex-1 flex-wrap items-center gap-8">
    <button type="button" uiButton variant="primary" (click)="onReload()">
      {{ 'tradeInventory.conflict.reload' | transloco }}
    </button>
    <button type="button" uiButton variant="secondary" (click)="onCancel()">
      {{ 'tradeInventory.common.cancel' | transloco }}
    </button>
  </div>
</ui-modal>
