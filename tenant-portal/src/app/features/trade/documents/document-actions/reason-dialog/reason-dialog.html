<ui-modal
  size="confirm"
  [icon]="danger() ? 'tablerCircleX' : 'tablerPlayerPause'"
  [tile]="danger() ? 'bg-icon-red' : 'bg-icon-orange'"
  [title]="titleKey() ? (titleKey() | transloco) : ''"
  [closeLabel]="'tda.common.close' | transloco"
  [dismissable]="!danger() && !submitting()"
  (closed)="onModalClosed()"
>
  <div class="flex flex-col gap-8">
    <p class="text-12 leading-18 text-text-muted">{{ textKey() ? (textKey() | transloco) : '' }}</p>

    @if (open()) {
      <app-trade-reason-picker
        [kind]="reasonKind()"
        [(value)]="pickerValue"
        [idPrefix]="uid"
        [disabled]="submitting()"
        [showErrors]="showErrors()"
      />
    }
  </div>

  <div modal-footer class="flex flex-1 items-center gap-8">
    <button
      type="button"
      uiButton
      [variant]="danger() ? 'danger' : 'primary'"
      [loading]="submitting()"
      [disabled]="!canConfirm()"
      (click)="submit()"
    >
      {{ confirmKey() ? (confirmKey() | transloco) : '' }}
    </button>

    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="submitting()"
      (click)="cancel()"
    >
      {{ 'tda.common.cancel' | transloco }}
    </button>
  </div>
</ui-modal>
