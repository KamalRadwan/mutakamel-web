<ui-modal
  size="form"
  icon="tablerArrowsExchange"
  tile="bg-icon-violet"
  [title]="'itemsBulk.action.SET_STATUS' | transloco"
  [closeLabel]="'tradeShared.common.cancel' | transloco"
  [dismissable]="!submitting()"
  (closed)="onModalClosed()"
>
  <span
    modal-header-end
    class="inline-flex h-badge shrink-0 items-center rounded-8 bg-brand-soft px-8 text-12 font-medium whitespace-nowrap text-on-brand-soft tabular-nums"
  >
    {{ 'itemsBulk.itemsCount' | transloco: { count: selectedCount() } }}
  </span>

  <div class="flex flex-col gap-10">
    <ui-field
      size="bare"
      [label]="'itemsBulk.statusModal.status' | transloco"
      [for]="uid + '-status'"
      [hint]="'itemsBulk.statusModal.statusHint' | transloco"
      [required]="true"
    >
      <ui-dropdown
        class="w-full"
        size="field"
        [id]="uid + '-status'"
        [label]="'itemsBulk.statusModal.status' | transloco"
        [describedBy]="uid + '-status-hint'"
        [options]="statusOptions()"
        [value]="targetStatus()"
        [disabled]="submitting()"
        (valueChange)="onStatusChange($event)"
      />
    </ui-field>

    @if (targetStatus() === 'DISCONTINUED') {
      <app-trade-reason-picker
        #reasonPicker
        kind="ITEM_DISCONTINUE"
        [idPrefix]="uid + '-discontinue'"
        [value]="reasonValue()"
        [disabled]="submitting()"
        [showErrors]="showErrors()"
        (valueChange)="onReasonChange($event)"
      />
    }

    <p class="text-12 leading-18 text-text-muted">
      {{ 'itemsBulk.statusModal.note' | transloco }}
    </p>
  </div>

  <ng-container modal-footer>
    <button type="button" uiButton [loading]="submitting()" [disabled]="!canSubmit()" (click)="submit()">
      {{ 'itemsBulk.run' | transloco: { count: selectedCount() } }}
    </button>
    <button type="button" uiButton variant="secondary" [disabled]="submitting()" (click)="close()">
      {{ 'tradeShared.common.cancel' | transloco }}
    </button>
  </ng-container>
</ui-modal>
