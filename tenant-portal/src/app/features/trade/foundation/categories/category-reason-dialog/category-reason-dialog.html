<ui-modal
  size="confirm"
  [icon]="modalIcon()"
  [tile]="modalTile()"
  [title]="titleKey() | transloco: { name: targetName() }"
  [closeLabel]="'tradeShared.common.close' | transloco"
  [dismissable]="mode() !== 'delete' && !submitting()"
  (closed)="onModalClosed()"
>
  <div class="flex flex-col gap-8">
    <p class="text-12 leading-18 text-text-muted">{{ textKey() | transloco }}</p>

    @if (isOpen()) {
      <app-trade-reason-picker
        [kind]="reasonKind()"
        [(value)]="pickerValue"
        [idPrefix]="uid"
        [disabled]="submitting()"
        [showErrors]="showErrors()"
      />
    }
  </div>

  <div modal-footer class="flex flex-1 items-center gap-8">
    <button
      type="button"
      uiButton
      [variant]="mode() === 'delete' ? 'danger' : 'primary'"
      [loading]="submitting()"
      [disabled]="submitting() || !pickerValid()"
      (click)="submit()"
    >
      {{ confirmKey() | transloco }}
    </button>

    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="submitting()"
      (click)="close()"
    >
      {{ 'tradeShared.common.cancel' | transloco }}
    </button>
  </div>
</ui-modal>
