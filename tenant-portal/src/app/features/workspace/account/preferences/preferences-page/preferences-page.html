@if (loading() && (!me() || !profile())) {
  <div class="flex flex-col gap-8" aria-busy="true">
    @for (card of skeletonCards; track card) {
      <div class="flex flex-col gap-8 rounded-10 border border-border bg-surface p-8 shadow-card">
        <span class="h-skeleton-line w-1/3 rounded-4 bg-neutral-soft motion-safe:animate-pulse"></span>
        <span class="h-skeleton-line w-full rounded-4 bg-neutral-soft motion-safe:animate-pulse"></span>
        <span class="h-skeleton-line w-2/3 rounded-4 bg-neutral-soft motion-safe:animate-pulse"></span>
      </div>
    }
  </div>
} @else if (loadFailed() || !me() || !profile()) {
  <div
    role="alert"
    class="flex flex-1 flex-col items-center justify-center gap-8 rounded-10 border border-border bg-surface p-16 text-center shadow-card"
  >
    <span class="inline-flex size-icon-tile-lg items-center justify-center rounded-8 bg-icon-red text-on-icon">
      <ng-icon name="tablerCloudOff" size="20" aria-hidden="true" />
    </span>
    <p class="text-12 leading-18 text-text-muted">{{ 'wsAccPrefs.loadFailed' | transloco }}</p>
    <button type="button" uiButton variant="primary" (click)="load()">
      {{ 'wsAccPrefs.retry' | transloco }}
    </button>
  </div>
} @else if (me(); as currentMe) {
  @if (profile(); as currentProfile) {
    <app-profile-card [me]="currentMe" />

    <app-appearance-card [profile]="currentProfile" (profileChange)="onProfileChange($event)" />

    <app-account-section
      icon="tablerHome"
      tile="bg-icon-orange"
      [title]="'wsAccPrefs.defaults.title' | transloco"
      [description]="'wsAccPrefs.defaults.desc' | transloco"
    >
      <div class="grid grid-cols-1 gap-x-10 gap-y-8 desktop:grid-cols-2">
        <ui-field
          size="bare"
          [for]="uid + '-start-page'"
          [label]="'wsAccPrefs.defaults.startPage' | transloco"
          [hint]="'wsAccPrefs.defaults.startPageHint' | transloco"
        >
          <ui-dropdown
            class="w-full"
            size="field"
            [id]="uid + '-start-page'"
            [describedBy]="uid + '-start-page-hint'"
            [label]="'wsAccPrefs.defaults.startPage' | transloco"
            [options]="startPageOptions()"
            [value]="startPage()"
            [disabled]="savingStartPage()"
            (valueChange)="onStartPageChange($event)"
          />
        </ui-field>
      </div>
    </app-account-section>
  }
}
