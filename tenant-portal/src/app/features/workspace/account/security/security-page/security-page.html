@if (loading() && !me()) {
  @for (card of skeletonCards; track card) {
    <div class="flex flex-col gap-8 rounded-10 border border-border bg-surface p-8 shadow-card" aria-busy="true">
      <div class="flex items-center gap-8">
        <span class="size-icon-tile-sm shrink-0 rounded-8 bg-neutral-soft motion-safe:animate-pulse" aria-hidden="true"></span>
        <span class="h-skeleton-line w-1/3 rounded-4 bg-neutral-soft motion-safe:animate-pulse" aria-hidden="true"></span>
      </div>
      <span class="h-skeleton-line w-full rounded-4 bg-neutral-soft motion-safe:animate-pulse" aria-hidden="true"></span>
      <span class="h-skeleton-line w-2/3 rounded-4 bg-neutral-soft motion-safe:animate-pulse" aria-hidden="true"></span>
    </div>
  }
} @else if (failed() && !me()) {
  <div
    role="alert"
    class="flex flex-col items-center justify-center gap-8 rounded-10 border border-border bg-surface p-16 text-center shadow-card"
  >
    <span class="inline-flex size-icon-tile-lg items-center justify-center rounded-8 bg-icon-red text-on-icon">
      <ng-icon name="tablerCloudOff" size="20" aria-hidden="true" />
    </span>
    <p class="text-12 leading-18 text-text-muted">{{ 'wsAccSec.loadFailed' | transloco }}</p>
    <button type="button" uiButton variant="primary" (click)="load()">
      {{ 'wsAccSec.retry' | transloco }}
    </button>
  </div>
} @else {
  <app-password-card [primary]="!!me()?.mfaEnabled" (changed)="sessions()?.reload()" />
  <app-mfa-card [me]="me()" />
}

<app-account-sessions />
