@if (isForbidden()) {
  <app-billing-forbidden />
} @else if (failed()) {
  <app-billing-failed [correlationId]="errorCorrelationId()" (retry)="reload()" />
} @else {
  <div
    class="flex shrink-0 items-center justify-between gap-8 rounded-10 border border-border bg-surface p-8 shadow-card"
  >
    <ui-dropdown
      class="shrink-0"
      [options]="appFilterOptions()"
      [label]="'bcat.toolbar.appFilterLabel' | transloco"
      [value]="selectedAppKey()"
      [disabled]="loading()"
      (valueChange)="onAppFilterChange($event)"
    />

    <button
      type="button"
      class="inline-flex size-btn shrink-0 cursor-pointer items-center justify-center rounded-8 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text active:bg-border focus-visible:ring-3 focus-visible:ring-focus-halo-strong disabled:cursor-not-allowed disabled:text-text-placeholder disabled:hover:bg-transparent"
      [disabled]="loading()"
      [attr.aria-label]="'bcat.toolbar.reload' | transloco"
      [title]="'bcat.toolbar.reload' | transloco"
      (click)="reload()"
    >
      <ng-icon name="tablerRefresh" size="15" [class.animate-spin]="loading()" aria-hidden="true" />
    </button>
  </div>

  @if (loading()) {
    <div class="flex flex-col gap-12" aria-busy="true">
      @for (card of skeletonCards; track card) {
        <div class="flex flex-col gap-8 rounded-10 border border-border bg-surface p-8 shadow-popover">
          <div class="flex items-center justify-between gap-8">
            <div class="flex min-w-0 flex-1 items-center gap-8">
              <span class="size-icon-tile shrink-0 animate-pulse rounded-8 bg-neutral-soft"></span>
              <span class="h-skeleton-line w-1/4 animate-pulse rounded-4 bg-neutral-soft"></span>
            </div>
            <span class="h-badge w-1/4 animate-pulse rounded-8 bg-neutral-soft"></span>
          </div>

          <div class="grid auto-rows-fr grid-cols-1 gap-8 desktop:grid-cols-3">
            <div class="flex flex-col gap-8 rounded-10 border border-border p-8">
              <span class="h-skeleton-line w-1/2 animate-pulse rounded-4 bg-neutral-soft"></span>
              <span class="h-skeleton-line w-2/3 animate-pulse rounded-4 bg-neutral-soft"></span>
              <div class="mt-auto flex items-center justify-between gap-8 pt-4">
                <span class="h-btn-h-sm w-1/3 animate-pulse rounded-6 bg-neutral-soft"></span>
                <span class="h-btn-h-sm w-1/4 animate-pulse rounded-6 bg-neutral-soft"></span>
              </div>
            </div>
            <div class="flex flex-col gap-8 rounded-10 border border-border p-8">
              <span class="h-skeleton-line w-1/2 animate-pulse rounded-4 bg-neutral-soft"></span>
              <span class="h-skeleton-line w-2/3 animate-pulse rounded-4 bg-neutral-soft"></span>
              <div class="mt-auto flex items-center justify-between gap-8 pt-4">
                <span class="h-btn-h-sm w-1/3 animate-pulse rounded-6 bg-neutral-soft"></span>
                <span class="h-btn-h-sm w-1/4 animate-pulse rounded-6 bg-neutral-soft"></span>
              </div>
            </div>
            <div class="flex flex-col gap-8 rounded-10 border border-border p-8">
              <span class="h-skeleton-line w-1/2 animate-pulse rounded-4 bg-neutral-soft"></span>
              <span class="h-skeleton-line w-2/3 animate-pulse rounded-4 bg-neutral-soft"></span>
              <div class="mt-auto flex items-center justify-between gap-8 pt-4">
                <span class="h-btn-h-sm w-1/3 animate-pulse rounded-6 bg-neutral-soft"></span>
                <span class="h-btn-h-sm w-1/4 animate-pulse rounded-6 bg-neutral-soft"></span>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  } @else if (visibleGroups().length === 0) {
    <div
      class="flex flex-1 flex-col items-center justify-center gap-8 rounded-10 border border-border bg-surface p-16 text-center shadow-card"
    >
      <span
        class="inline-flex size-icon-tile-lg items-center justify-center rounded-8 bg-icon-teal text-on-icon"
      >
        <ng-icon name="tablerApps" size="18" aria-hidden="true" />
      </span>
      <p class="text-12 leading-18 text-text-muted">{{ 'bcat.empty.title' | transloco }}</p>
    </div>
  } @else {
    <div class="flex flex-col gap-12">
      @for (group of visibleGroups(); track group.application.id) {
        <app-offer-card
          [group]="group"
          [cycle]="cycle()"
          (openPrices)="openPrices($event)"
        />
      }
    </div>
  }

  <app-price-ladder-modal />
}
