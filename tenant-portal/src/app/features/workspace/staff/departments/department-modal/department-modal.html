<ui-modal
  #modal
  size="form"
  icon="tablerSitemap"
  tile="bg-icon-orange"
  [title]="(mode() === 'create' ? 'departments.modal.new' : 'departments.modal.title') | transloco"
  [closeLabel]="'departments.close' | transloco"
  [dismissable]="!saving()"
  (closed)="onModalClosed()"
>
  <form [id]="uid + '-form'" class="grid grid-cols-2 gap-x-10 gap-y-8" novalidate (submit)="save($event)">
    <app-org-cascade
      [levels]="['company', 'branch']"
      [required]="mode() === 'create' ? ['company', 'branch'] : []"
      [readonly]="mode() === 'details' || !canManage()"
      [disabledLevels]="saving() ? ['company', 'branch'] : []"
      [activeOnly]="mode() === 'create'"
      [companySource]="companyOptions()"
      [placementSource]="{ branches: branchOptions(), departments: [], teams: [] }"
      [errors]="cascadeErrors()"
      [value]="cascadeValue()"
      (valueChange)="onCascadeChange($event)"
    />

    <div class="col-span-1">
      <ui-field
        [for]="uid + '-code'"
        [label]="'departments.fields.code' | transloco"
        [hint]="'departments.fields.codeHint' | transloco"
        [required]="mode() === 'create'"
        [error]="codeError()"
      >
        <input
          [id]="uid + '-code'"
          type="text"
          dir="ltr"
          class="min-w-0 flex-1 bg-transparent text-12 tabular-nums text-text outline-none placeholder:text-text-placeholder"
          [placeholder]="mode() === 'create' ? ('departments.fields.codePlaceholder' | transloco) : ''"
          [maxLength]="limits.code"
          [value]="code()"
          [readOnly]="mode() === 'details' || !canManage() || saving()"
          [attr.aria-readonly]="mode() === 'details' || !canManage() ? 'true' : null"
          [attr.aria-invalid]="codeError() ? 'true' : null"
          (input)="onCodeInput($event)"
          (blur)="markTouched('code')"
        />
      </ui-field>
    </div>

    <div class="col-span-1">
      <ui-field
        [for]="uid + '-name'"
        [label]="'departments.fields.name' | transloco"
        [hint]="'departments.fields.nameHint' | transloco"
        [required]="true"
        [count]="nameCount()"
        [max]="limits.name"
        [error]="nameError()"
      >
        <input
          [id]="uid + '-name'"
          type="text"
          class="min-w-0 flex-1 bg-transparent text-12 text-text outline-none placeholder:text-text-placeholder"
          [placeholder]="'departments.fields.namePlaceholder' | transloco"
          [maxLength]="limits.name"
          [value]="name()"
          [readOnly]="!canManage() || saving()"
          [attr.aria-readonly]="!canManage() ? 'true' : null"
          [attr.aria-invalid]="nameError() ? 'true' : null"
          (input)="onNameInput($event)"
          (blur)="markTouched('name')"
        />
      </ui-field>
    </div>

    @if (mode() === 'details') {
      <div class="col-span-2">
        <ui-field
          size="bare"
          [for]="uid + '-active'"
          [label]="'departments.fields.active' | transloco"
          [hint]="'departments.fields.activeHint' | transloco"
        >
          <div
            class="flex h-field items-center justify-between gap-8 rounded-8 border border-border-field bg-surface-field px-8"
          >
            <app-staff-status-badge [status]="isActive() ? 'ACTIVE' : 'INACTIVE'" />
          </div>
        </ui-field>
      </div>
    }
  </form>

  <div modal-footer class="flex flex-1 flex-wrap items-center gap-8">
    @if (canManage()) {
      <button
        type="submit"
        [attr.form]="uid + '-form'"
        uiButton
        [loading]="saving()"
        [disabled]="saving()"
      >
        {{ 'departments.save' | transloco }}
      </button>


      <button type="button" uiButton variant="ghost" [disabled]="saving()" (click)="requestClose()">
        {{ (mode() === 'create' ? 'departments.cancel' : 'departments.close') | transloco }}
      </button>

    } @else {
      <button type="button" uiButton variant="ghost" (click)="requestClose()">
        {{ 'departments.close' | transloco }}
      </button>
    }
  </div>
</ui-modal>

<ui-confirm-dialog
  #discardDialog
  tone="warning"
  [title]="'departments.confirm.discardTitle' | transloco"
  [text]="'departments.confirm.discardText' | transloco"
  [confirmLabel]="'departments.confirm.discardConfirm' | transloco"
  [cancelLabel]="'departments.cancel' | transloco"
/>

<ui-confirm-dialog
  #staleDialog
  tone="warning"
  [title]="'departments.confirm.staleTitle' | transloco"
  [text]="'departments.confirm.staleText' | transloco"
  [confirmLabel]="'departments.confirm.reload' | transloco"
  [cancelLabel]="'departments.confirm.keepChanges' | transloco"
/>
