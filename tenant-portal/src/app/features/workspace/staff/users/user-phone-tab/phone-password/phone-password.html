@if (readonly()) {
  <div class="flex h-field items-center rounded-8 border border-border-field bg-surface-field px-8 text-12 text-text">
    @if (configured()) {
      <span class="inline-flex h-badge items-center gap-4 rounded-8 bg-success px-8 text-12 font-medium whitespace-nowrap text-on-success">
        <ng-icon name="tablerLock" size="11" class="shrink-0" aria-hidden="true" />
        <span>{{ 'userPhone.password.set' | transloco }}</span>
      </span>
    } @else {
      <span class="inline-flex h-badge items-center rounded-8 bg-neutral-soft px-8 text-12 font-medium whitespace-nowrap text-text-muted">
        {{ 'userPhone.password.notSet' | transloco }}
      </span>
    }
  </div>
} @else if (configured() && !changing()) {
  <div class="flex items-center gap-6">
    <div class="flex h-field min-w-0 flex-1 items-center rounded-8 border border-border-field bg-surface-field px-8">
      <span class="inline-flex h-badge items-center gap-4 rounded-8 bg-success px-8 text-12 font-medium whitespace-nowrap text-on-success">
        <ng-icon name="tablerLock" size="11" class="shrink-0" aria-hidden="true" />
        <span>{{ 'userPhone.password.set' | transloco }}</span>
      </span>
    </div>

    <button
      type="button"
      uiButton
      variant="secondary"
      size="small"
      [attr.id]="fieldId() || null"
      [attr.aria-describedby]="describedBy() || null"
      [disabled]="disabled()"
      (click)="startChange()"
    >
      {{ 'userPhone.password.change' | transloco }}
    </button>
  </div>
} @else {
  <div class="flex items-center gap-6">
    <div
      class="flex h-field min-w-0 flex-1 items-center gap-4 overflow-hidden rounded-8 border bg-surface-field ps-8 pe-2 text-12 text-text transition-colors duration-fast"
      [class]="
        hasError()
          ? 'border-danger-border ring-2 ring-danger-halo'
          : 'border-border-field hover:border-border-field-hover focus-within:border-focus-ring focus-within:ring-3 focus-within:ring-focus-halo'
      "
    >
      <input
        #pwdInput
        [attr.id]="fieldId() || null"
        [type]="revealed() ? 'text' : 'password'"
        dir="ltr"
        autocomplete="new-password"
        class="h-full min-w-0 flex-1 bg-transparent text-12 text-text outline-none placeholder:text-text-placeholder"
        [value]="value() ?? ''"
        [readOnly]="disabled()"
        [attr.aria-describedby]="describedBy() || null"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        (input)="onInput($event)"
      />
      <button
        type="button"
        class="inline-flex size-btn-h-sm shrink-0 cursor-pointer items-center justify-center rounded-6 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
        [attr.aria-label]="(revealed() ? 'userPhone.password.hide' : 'userPhone.password.show') | transloco"
        [title]="(revealed() ? 'userPhone.password.hide' : 'userPhone.password.show') | transloco"
        (click)="toggleReveal()"
      >
        <ng-icon [name]="revealed() ? 'tablerEyeOff' : 'tablerEye'" size="14" aria-hidden="true" />
      </button>
    </div>

    @if (configured()) {
      <button
        type="button"
        uiButton
        variant="ghost"
        size="small"
        [disabled]="disabled()"
        (click)="keepCurrent()"
      >
        {{ 'userPhone.password.keepCurrent' | transloco }}
      </button>
    }
  </div>
}
