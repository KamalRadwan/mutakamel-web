<ui-modal
  size="alert"
  icon="tablerAlertTriangle"
  tile="bg-icon-orange"
  [title]="modalTitle()"
  [closeLabel]="'staff.blockers.close' | transloco"
  [dismissable]="!running()"
  (closed)="onClosed()"
>
  <div class="flex flex-col gap-8">
    <p class="text-12 leading-18 text-text-muted">{{ (rows().length === 1 ? 'staff.blockers.introOne' : 'staff.blockers.intro') | transloco }}</p>

    @if (rows().length > 0) {
      <ul class="flex flex-col gap-6">
        @for (row of rows(); track $index) {
          <li class="flex items-center justify-between gap-8 rounded-8 border border-border bg-surface-muted px-8 py-6">
            <span class="min-w-0 flex-1 text-12 leading-18 text-text">{{ row.text }}</span>
            @if (row.link; as link) {
              <button
                type="button"
                uiButton
                variant="ghost"
                size="small"
                [disabled]="running()"
                (click)="openLink(link)"
              >
                {{ link.label || ('staff.blockers.view' | transloco) }}
              </button>
            }
          </li>
        }
      </ul>
    }
  </div>

  <div modal-footer class="flex flex-1 flex-wrap items-center gap-8">
    @if (state()?.primaryAction; as action) {
      <button
        type="button"
        uiButton
        variant="primary"
        [loading]="running()"
        (click)="runPrimary()"
      >
        {{ action.label }}
      </button>
    }
    <button
      type="button"
      uiButton
      variant="secondary"
      [disabled]="running()"
      (click)="close()"
    >
      {{ 'staff.blockers.close' | transloco }}
    </button>
  </div>
</ui-modal>
