<section class="flex flex-col gap-8 rounded-10 border border-border bg-surface p-12 shadow-card">
  <div class="flex items-center gap-8">
    <span class="inline-flex size-icon-tile shrink-0 items-center justify-center rounded-8 bg-icon-violet text-on-icon">
      <ng-icon name="tablerPalette" size="15" aria-hidden="true" />
    </span>
    <h2 class="min-w-0 truncate text-13 leading-18 font-medium text-text">
      {{ 'wsBranding.colours.title' | transloco }}
    </h2>
  </div>

  <div class="flex flex-col gap-8">
    <ui-field
      size="bare"
      [for]="uid + '-primary'"
      [label]="'wsBranding.fields.primary' | transloco"
      [hint]="'wsBranding.fields.primaryHint' | transloco"
      [error]="errors().primary"
    >
      <ui-color-picker
        #primaryPicker
        [id]="uid + '-primary'"
        placeholder="#2563EB"
        [ariaLabel]="'wsBranding.fields.primary' | transloco"
        [describedBy]="uid + '-primary-hint' + (errors().primary ? ' ' + uid + '-primary-error' : '')"
        [nullable]="true"
        [readonly]="readOnly()"
        [invalid]="!!errors().primary"
        [suppressInlineError]="true"
        [value]="primary()"
        (valueChange)="onPrimaryPicked($event)"
        (rawValueChange)="onPrimaryRawInput($event)"
        (touch)="fieldBlur.emit('primary')"
      />
    </ui-field>

    <ui-field
      size="bare"
      [for]="uid + '-secondary'"
      [label]="'wsBranding.fields.secondary' | transloco"
      [hint]="'wsBranding.fields.secondaryHint' | transloco"
      [error]="errors().secondary"
    >
      <ui-color-picker
        #secondaryPicker
        [id]="uid + '-secondary'"
        placeholder="#0F172A"
        [ariaLabel]="'wsBranding.fields.secondary' | transloco"
        [describedBy]="uid + '-secondary-hint' + (errors().secondary ? ' ' + uid + '-secondary-error' : '')"
        [nullable]="true"
        [readonly]="readOnly()"
        [invalid]="!!errors().secondary"
        [suppressInlineError]="true"
        [value]="secondary()"
        (valueChange)="onSecondaryPicked($event)"
        (rawValueChange)="onSecondaryRawInput($event)"
        (touch)="fieldBlur.emit('secondary')"
      />
    </ui-field>
  </div>
</section>
