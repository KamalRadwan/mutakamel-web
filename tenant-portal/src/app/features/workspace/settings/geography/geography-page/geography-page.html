<div
  role="tablist"
  [attr.aria-label]="'wsGeo.tabs.label' | transloco"
  class="mx-12 mt-12 flex h-tab shrink-0 items-stretch overflow-x-auto border-b border-border text-12 leading-18 no-scrollbar"
  (keydown)="onTabKeydown($event)"
>
  @for (tab of tabs; track tab.id) {
    <a
      #tabLink
      #rla="routerLinkActive"
      role="tab"
      [id]="'ws-geo-tab-' + tab.id"
      aria-controls="ws-geo-panel"
      [routerLink]="tab.id"
      routerLinkActive
      queryParamsHandling="preserve"
      [attr.aria-selected]="rla.isActive"
      [tabIndex]="rla.isActive ? 0 : -1"
      class="inline-flex h-tab cursor-pointer items-center gap-6 px-10 text-12 leading-18 whitespace-nowrap outline-none transition-colors duration-fast focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
      [class]="rla.isActive ? 'font-medium text-accent subnav-active' : 'text-text-muted hover:text-text'"
    >
      <ng-icon [name]="tab.icon" size="14" aria-hidden="true" />
      <span>{{ tab.labelKey | transloco }}</span>
    </a>
  }
</div>

<div
  id="ws-geo-panel"
  role="tabpanel"
  [attr.aria-labelledby]="'ws-geo-tab-' + activeTabId()"
  class="flex min-h-0 flex-1 flex-col"
>
  <router-outlet />
</div>
