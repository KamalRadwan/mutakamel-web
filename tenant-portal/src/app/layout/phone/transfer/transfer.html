<ui-field class="shrink-0" size="bare" [label]="'webPhone.transfer.type' | transloco" [hint]="'webPhone.transfer.typeHint' | transloco">
  <ui-segmented
    class="transfer-segmented"
    [options]="typeOptions()"
    [label]="'webPhone.transfer.type' | transloco"
    [(value)]="transferKind"
  />
</ui-field>

<ui-field
  class="shrink-0"
  for="phone-transfer-input"
  [label]="'webPhone.transfer.target' | transloco"
  [hint]="'webPhone.transfer.targetHint' | transloco"
  [bare]="true"
>
  <div
    class="flex h-table-head items-center gap-2 rounded-10 border border-icon-violet bg-surface-muted ps-10 pe-4 transition-colors duration-fast focus-within:ring-3 focus-within:ring-focus-halo"
  >
    <input
      id="phone-transfer-input"
      type="text"
      inputmode="tel"
      dir="ltr"
      class="min-w-0 flex-1 bg-transparent text-start text-16 leading-22 font-medium text-text tabular-nums outline-none placeholder:text-12 placeholder:font-normal placeholder:text-text-placeholder"
      [placeholder]="'webPhone.dialer.enterNumber' | transloco"
      [value]="phone.transferValue()"
      (input)="onInput($event)"
      (keydown.enter)="submit()"
    />
    <button
      type="button"
      class="inline-flex size-btn shrink-0 cursor-pointer items-center justify-center rounded-8 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong disabled:cursor-not-allowed disabled:text-text-placeholder disabled:hover:bg-transparent"
      [disabled]="!phone.transferValue()"
      [attr.aria-label]="'webPhone.dialer.deleteDigit' | transloco"
      [title]="'webPhone.dialer.deleteDigit' | transloco"
      (click)="deleteKey()"
    >
      <ng-icon name="tablerBackspace" size="15" aria-hidden="true" />
    </button>
  </div>
</ui-field>

<app-keypad (pressed)="pressKey($event)" />

@if (transferring()) {
  <div class="flex shrink-0 items-center justify-center gap-6 text-12 leading-18 text-text-muted" aria-live="polite">
    <ng-icon name="tablerLoader2" size="16" class="animate-spin" aria-hidden="true" />
    <span>{{ 'webPhone.transfer.transferring' | transloco }}</span>
  </div>
}

<div class="grid shrink-0 grid-cols-2 gap-6">
  <button
    type="button"
    class="inline-flex h-table-head min-w-0 cursor-pointer items-center justify-center gap-6 rounded-10 border border-border bg-surface-muted px-6 text-12 leading-18 font-medium text-text outline-none transition-colors duration-fast hover:bg-row-hover focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
    (click)="cancelled.emit()"
  >
    <span class="truncate">{{ 'webPhone.common.cancel' | transloco }}</span>
  </button>

  <button
    type="button"
    class="inline-flex h-table-head min-w-0 cursor-pointer items-center justify-center gap-6 rounded-10 px-6 text-12 leading-18 font-medium outline-none transition-colors duration-fast focus-visible:ring-3 focus-visible:ring-focus-halo-strong disabled:cursor-not-allowed"
    [class]="
      phone.transferValue().trim() && !transferring()
        ? 'bg-icon-violet text-on-icon hover:bg-icon-violet-hover active:bg-icon-violet-pressed'
        : 'bg-neutral-soft text-text-muted'
    "
    [disabled]="!phone.transferValue().trim() || transferring()"
    (click)="submit()"
  >
    <ng-icon [name]="isDirect() ? 'tablerArrowsExchange' : 'tablerPhone'" size="15" class="shrink-0" aria-hidden="true" />
    <span class="truncate">
      @if (isDirect()) {
        {{ 'webPhone.transfer.transferNow' | transloco }}
      } @else {
        @let parts = callTargetParts();
        {{ parts.before }}<bdi dir="ltr">{{ parts.target }}</bdi>{{ parts.after }}
      }
    </span>
  </button>
</div>

<div class="flex shrink-0 flex-col gap-6">
  <app-audio-row kind="speaker" />
  <app-audio-row kind="mic" />
</div>

<app-status-line />
