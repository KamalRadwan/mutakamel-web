@if (items().length > 0) {
  <ul class="m-0 flex list-none flex-col gap-6 p-0" [attr.aria-label]="ariaLabel()">
    @for (item of items(); track item.id) {
      <li>
        <button
          type="button"
          class="flex min-h-btn w-full cursor-pointer items-center gap-6 rounded-6 px-4 py-2 text-start text-12 leading-18 text-text outline-none transition-colors duration-fast hover:bg-row-hover focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          [title]="item.tooltip"
          (click)="onSelect(item)"
        >
          <ui-badge tone="count">{{ item.rank }}</ui-badge>
          <span class="flex min-w-0 flex-1 flex-col gap-2">
            <span class="truncate text-12 leading-16 text-text" [title]="item.label">{{ item.label }}</span>
            <span class="block h-status-bar w-full overflow-hidden rounded-full bg-neutral-soft" aria-hidden="true">
              <span class="block h-full rounded-full bg-accent" [style.inline-size.%]="item.percent"></span>
            </span>
          </span>
          <span
            class="shrink-0 text-end text-12 leading-16 font-medium text-text tabular-nums"
            [title]="item.formattedValue"
          >
            <bdi dir="ltr">{{ item.formattedValue }}</bdi>
          </span>
        </button>
      </li>
    }
  </ul>
}
