@if (items().length > 0) {
  <ul class="m-0 flex list-none flex-col divide-y divide-border p-0" [attr.aria-label]="title()">
    @for (item of items(); track item.id) {
      <li>
        <button
          type="button"
          class="flex min-h-table-row w-full cursor-pointer items-center gap-8 px-4 py-6 text-start outline-none transition-colors duration-fast hover:bg-row-hover focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          (click)="openRecord.emit(item.entityRef)"
        >
          <span
            class="inline-flex size-avatar shrink-0 items-center justify-center rounded-full bg-neutral-soft text-11 font-medium text-text"
            aria-hidden="true"
          >
            {{ item.initials }}
          </span>
          <span class="min-w-0 flex-1 truncate text-12 leading-18 text-text" [title]="item.text">
            {{ item.text }}
          </span>
          <span class="shrink-0 whitespace-nowrap text-11 leading-16 text-text-muted tabular-nums">
            @if (item.isClockOnly) {
              <bdi dir="ltr">{{ item.time }}</bdi>
            } @else {
              {{ item.time }}
            }
          </span>
        </button>
      </li>
    }
  </ul>
}
