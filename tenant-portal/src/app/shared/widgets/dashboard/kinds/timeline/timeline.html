@if (items().length > 0) {
  <ol class="m-0 flex list-none flex-col p-0" [attr.aria-label]="title()">
    @for (item of items(); track item.id; let isFirst = $first; let isLast = $last) {
      <li class="flex items-stretch gap-8">
        <span class="flex w-timeline-dot shrink-0 flex-col items-center" aria-hidden="true">
          <span class="h-4 w-2 flex-none" [class.bg-border]="!isFirst"></span>
          <span class="size-timeline-dot shrink-0 rounded-full bg-accent"></span>
          <span class="w-2 flex-1" [class.bg-border]="!isLast"></span>
        </span>
        <button
          type="button"
          class="min-w-0 flex-1 cursor-pointer rounded-6 px-4 pb-8 text-start outline-none transition-colors duration-fast hover:bg-row-hover focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          (click)="onSelect(item)"
        >
          <span class="block truncate text-12 leading-18 font-medium text-text" [title]="item.title">
            {{ item.title }}
          </span>
          <span class="block truncate text-11 leading-16 text-text-muted" [title]="item.dateText">
            {{ item.dateText }}
          </span>
        </button>
      </li>
    }
  </ol>
}
