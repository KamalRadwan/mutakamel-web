@if (items().length > 0) {
  <div class="grid h-full min-w-0 items-stretch" [class]="gridColsClass()">
    @for (item of items(); track item.key; let isFirst = $first; let isLast = $last) {
      <div
        class="min-w-0"
        [class.border-s]="!isFirst"
        [class.border-border]="!isFirst"
        [class.ps-8]="!isFirst"
        [class.pe-8]="!isLast"
      >
        <ui-stat-card
          [framed]="false"
          [label]="item.label"
          [value]="item.value"
          [valueTitle]="item.value"
          [chart]="item.chart"
        />
      </div>
    }
  </div>
}
