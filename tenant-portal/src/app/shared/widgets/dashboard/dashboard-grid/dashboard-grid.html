<span [id]="keyboardHintId" class="sr-only">{{ keyboardHint() }}</span>

<div
  #host
  class="grid-stack"
  [class.dashboard-grid-editing]="editing()"
  (keydown.escape)="onEscape()"
>
  @for (item of items(); track item.id) {
    <div
      class="grid-stack-item"
      [attr.gs-id]="item.id"
      [attr.gs-x]="item.x"
      [attr.gs-y]="item.y"
      [attr.gs-w]="item.w"
      [attr.gs-h]="item.h"
      [attr.gs-min-w]="item.minW"
      [attr.gs-min-h]="item.minH"
      [attr.gs-max-w]="item.maxW ?? null"
      [attr.gs-max-h]="item.maxH ?? null"
    >
      <div
        class="grid-stack-item-content rounded-10 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
        role="group"
        [attr.aria-label]="item.label ?? null"
        [attr.tabindex]="editing() ? 0 : null"
        [attr.aria-describedby]="editing() && keyboardHint() ? keyboardHintId : null"
        (click)="onItemSelect(item.id)"
        (focus)="onItemSelect(item.id)"
        (keydown)="onItemKeydown($event, item.id)"
      >
        @if (tpl(); as itemTpl) {
          <ng-container *ngTemplateOutlet="itemTpl; context: { $implicit: item }" />
        }
      </div>
    </div>
  }
</div>
