<div
  class="flex flex-col items-center justify-center gap-6 rounded-10 border border-dashed p-10 text-center transition-colors duration-fast"
  [class]="dragging() ? 'border-brand bg-brand-soft' : 'border-border bg-surface-muted'"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <span class="inline-flex size-icon-tile shrink-0 items-center justify-center rounded-8 bg-icon-teal text-on-icon">
    <ng-icon name="tablerUpload" size="15" aria-hidden="true" />
  </span>

  @if (title()) {
    <p class="text-13 font-medium text-text">{{ title() }}</p>
  }
  @if (hint()) {
    <p class="text-12 text-text-muted">{{ hint() }}</p>
  }

  <button
    type="button"
    uiButton
    variant="secondary"
    size="small"
    [attr.id]="id() || null"
    [attr.aria-describedby]="describedBy() || null"
    [disabled]="disabled()"
    (click)="fileInput.click()"
  >
    {{ browseLabel() || ('common.browse' | transloco) }}
  </button>

  <input
    #fileInput
    type="file"
    class="hidden"
    [accept]="accept()"
    [disabled]="disabled()"
    [attr.aria-label]="browseLabel() || ('common.browse' | transloco)"
    (change)="onFileSelected($event)"
  />
</div>
