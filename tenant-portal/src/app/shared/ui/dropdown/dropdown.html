<button
  #trigger
  type="button"
  [attr.id]="id() || null"
  class="inline-flex w-full cursor-pointer items-center justify-between rounded-8 px-8 text-12 outline-none transition-colors duration-fast"
  [class]="
    (size() === 'field'
      ? 'h-field gap-6 border bg-surface-field text-text disabled:cursor-not-allowed disabled:bg-neutral-soft disabled:text-text-placeholder ' +
        (open()
          ? 'border-focus-ring ring-3 ring-focus-halo-strong'
          : 'border-border-field hover:border-border-field-hover focus-visible:border-focus-ring focus-visible:ring-3 focus-visible:ring-focus-halo-strong')
      : 'h-btn gap-4 focus-visible:ring-3 focus-visible:ring-focus-halo-strong ' +
        (tone() === 'nav'
          ? 'bg-nav-glass text-on-nav'
          : 'border border-border-field bg-surface text-text hover:border-border-field-hover disabled:cursor-not-allowed disabled:bg-neutral-soft disabled:text-text-placeholder'))
  "
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="label()"
  [attr.aria-describedby]="describedBy() || null"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span class="flex min-w-0 items-center gap-6">
    @if (icon()) {
      <ng-icon [name]="icon()" size="15" class="shrink-0" aria-hidden="true" />
    }
    <span [class]="size() === 'button' && icon() ? 'hidden desktop:inline truncate' : 'truncate'">{{ selected()?.label }}</span>
  </span>
  <span class="inline-flex shrink-0" [class]="tone() === 'nav' ? 'text-on-nav-muted' : 'text-text-muted'">
    <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
  </span>
</button>

@if (open()) {
  <ul
    #list
    role="listbox"
    class="fixed z-dropdown flex max-h-notif-list-max flex-col gap-2 overflow-y-auto rounded-10 border border-border bg-surface p-4 shadow-popover"
    [class.invisible]="!placed()"
    [style.top.px]="place().top"
    [style.inset-inline-start.px]="place().start"
    [style.min-width.px]="place().width"
    [style.max-height.px]="place().maxHeight"
    [attr.aria-label]="label()"
  >
    @for (option of options(); track option.value) {
      <li
        role="option"
        [attr.aria-selected]="option.value === value()"
        [attr.aria-disabled]="option.disabled ? 'true' : null"
      >
        <button
          type="button"
          class="flex h-menu-item w-full items-center justify-between gap-8 whitespace-nowrap rounded-6 px-8 text-12 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          [class]="
            option.disabled
              ? 'cursor-not-allowed text-text-placeholder opacity-drag-source'
              : option.value === value()
                ? 'cursor-pointer bg-brand-soft text-on-brand-soft'
                : 'cursor-pointer text-text hover:bg-row-hover'
          "
          [disabled]="!!option.disabled"
          [attr.aria-disabled]="option.disabled ? 'true' : null"
          [attr.aria-describedby]="option.title ? descId($index) : null"
          (click)="choose(option)"
          (mouseenter)="showTip(option, $event.currentTarget)"
          (mouseleave)="hideTip()"
          (focus)="showTip(option, $event.currentTarget)"
          (blur)="hideTip()"
        >
          <span>{{ option.label }}</span>
          @if (option.value === value()) {
            <ng-icon name="tablerCheck" size="14" aria-hidden="true" />
          }
        </button>
      </li>
    }
  </ul>

  <div hidden>
    @for (option of options(); track option.value) {
      @if (option.title) {
        <span [id]="descId($index)">{{ option.title }}</span>
      }
    }
  </div>

  @if (tip(); as activeTip) {
    <span
      aria-hidden="true"
      class="pointer-events-none fixed z-tooltip flex min-h-tooltip w-max max-w-modal-alert items-center whitespace-normal rounded-6 bg-tooltip-bg px-8 text-12 leading-20 text-on-tooltip"
      [style.top.px]="activeTip.top"
      [style.inset-inline-start.px]="activeTip.start"
    >
      {{ activeTip.text }}
    </span>
  }
}
