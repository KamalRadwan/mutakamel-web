<button
  #trigger
  type="button"
  class="flex h-field w-full cursor-pointer items-center gap-6 rounded-8 border bg-surface-field px-8 text-12 outline-none transition-colors duration-fast disabled:cursor-not-allowed disabled:border-transparent disabled:bg-neutral-soft disabled:text-text-placeholder"
  [class]="boxClasses()"
  [attr.id]="id()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-describedby]="describedBy() || null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span class="inline-flex shrink-0 text-text-muted">
    <ng-icon name="tablerCalendar" size="14" aria-hidden="true" />
  </span>
  <span class="min-w-0 flex-1 truncate text-start" [class]="!disabled() && displayValue() ? 'text-text' : 'text-text-placeholder'">
    {{ displayValue() || placeholder() }}
  </span>
  <span class="inline-flex shrink-0 text-text-muted">
    <ng-icon name="tablerChevronDown" size="14" aria-hidden="true" />
  </span>
</button>

@if (open()) {
  <div
    #popover
    role="dialog"
    aria-modal="false"
    class="fixed z-dropdown flex w-picker-w-single flex-col gap-6 rounded-12 border border-border bg-surface p-8 shadow-popover"
    [style.top.px]="place().top"
    [style.inset-inline-start.px]="place().start"
    [attr.aria-label]="ariaLabel() || monthLabel()"
    (keydown)="onPopoverKeydown($event)"
  >
    <div class="flex h-btn items-center justify-between gap-8">
      <button
        type="button"
        class="inline-flex size-btn-h-sm shrink-0 cursor-pointer items-center justify-center rounded-6 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
        [attr.aria-label]="prevMonthLabel()"
        (click)="shiftMonth(-1)"
      >
        <ng-icon name="tablerChevronLeft" size="14" class="rtl:-scale-x-100" aria-hidden="true" />
      </button>

      <span class="text-13 leading-18 font-medium text-text">{{ monthLabel() }}</span>

      <button
        type="button"
        class="inline-flex size-btn-h-sm shrink-0 cursor-pointer items-center justify-center rounded-6 text-text-muted outline-none transition-colors duration-fast hover:bg-neutral-soft hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
        [attr.aria-label]="nextMonthLabel()"
        (click)="shiftMonth(1)"
      >
        <ng-icon name="tablerChevronRight" size="14" class="rtl:-scale-x-100" aria-hidden="true" />
      </button>
    </div>

    <div class="grid h-badge grid-cols-7 items-center text-center text-11 leading-16 text-text-muted" aria-hidden="true">
      @for (weekday of weekdays(); track $index) {
        <span>{{ weekday }}</span>
      }
    </div>

    <div role="grid" class="grid grid-cols-7 justify-items-center gap-y-2">
      @for (day of days(); track day.iso) {
        <button
          type="button"
          class="inline-flex size-cal-cell-single items-center justify-center rounded-6 outline-none focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
          [class]="day.disabled ? 'cursor-not-allowed opacity-drag-source' : 'cursor-pointer'"
          [attr.data-iso]="day.iso"
          [attr.tabindex]="day.iso === tabbableIso() ? 0 : -1"
          [attr.aria-label]="day.ariaLabel"
          [attr.aria-selected]="day.isSelected"
          [attr.aria-current]="day.isToday ? 'date' : null"
          [disabled]="day.disabled"
          (click)="selectDay(day)"
        >
          <span
            class="inline-flex size-cal-mark items-center justify-center rounded-full text-12 leading-18 transition-colors duration-fast"
            [class]="dayMarkClasses(day)"
          >
            {{ day.label }}
          </span>
        </button>
      }
    </div>

    <div class="flex items-center justify-end border-t border-border pt-6">
      <button uiButton type="button" variant="ghost" size="small" [disabled]="todayDisabled()" (click)="selectToday()">
        {{ todayLabel() }}
      </button>
    </div>
  </div>
}
