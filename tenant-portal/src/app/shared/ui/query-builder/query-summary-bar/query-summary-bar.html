<div class="flex h-table-head items-center gap-8 rounded-10 border border-border bg-surface px-10 shadow-card">
  <span
    class="inline-flex size-icon-tile-sm shrink-0 items-center justify-center rounded-8 bg-icon-violet text-on-icon"
    aria-hidden="true"
  >
    <ng-icon name="tablerFilterCog" size="14" aria-hidden="true" />
  </span>

  <span class="shrink-0 text-12 leading-18 font-medium text-text">{{ title() }}</span>

  <span
    class="inline-flex h-badge shrink-0 items-center rounded-8 bg-brand-soft px-8 text-12 font-medium whitespace-nowrap text-on-brand-soft tabular-nums"
  >
    @if (count() > 0) {
      {{ 'qb.count' | transloco: { n: count(), g: groups() } }}
    } @else {
      {{ 'qb.none' | transloco }}
    }
  </span>

  <button
    type="button"
    dir="auto"
    class="min-w-0 flex-1 cursor-pointer truncate rounded-4 text-start text-12 text-text-muted outline-none transition-colors duration-fast hover:text-text focus-visible:ring-3 focus-visible:ring-focus-halo-strong disabled:cursor-not-allowed"
    [attr.title]="summaryText() || ('qb.none' | transloco)"
    [disabled]="disabled()"
    (click)="expand.emit()"
  >
    {{ summaryText() || ('qb.none' | transloco) }}
  </button>

  @if (dirty()) {
    <span class="shrink-0 text-12 whitespace-nowrap text-text-muted">{{ 'qb.unsaved' | transloco }}</span>
    <button
      type="button"
      uiButton
      variant="primary"
      size="small"
      [disabled]="disabled()"
      (click)="apply.emit()"
    >
      {{ 'qb.apply' | transloco }}
    </button>
  }

  <button
    type="button"
    uiButton
    variant="secondary"
    size="small"
    [disabled]="disabled()"
    (click)="expand.emit()"
  >
    <ng-icon name="tablerPencil" size="14" aria-hidden="true" />
    <span>{{ 'qb.edit' | transloco }}</span>
  </button>

  @if (count() > 0) {
    <button
      type="button"
      uiButton
      variant="ghost"
      size="small"
      [disabled]="disabled()"
      (click)="clear.emit()"
    >
      {{ 'qb.clear' | transloco }}
    </button>
  }
</div>
