@for (option of options(); track option.value) {
  <button
    #optionBtn
    type="button"
    role="radio"
    [attr.id]="$first ? (id() || null) : null"
    class="flex h-field items-center gap-6 rounded-8 px-10 text-12 outline-none transition-colors duration-fast focus-visible:ring-3 focus-visible:ring-focus-halo-strong"
    [class]="
      (option.value === value()
        ? 'bg-surface text-text font-medium shadow-card'
        : 'text-text-muted hover:text-text') +
      ' ' +
      (option.disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer')
    "
    [disabled]="!!option.disabled"
    [attr.aria-checked]="option.value === value()"
    [attr.aria-disabled]="option.disabled ? 'true' : null"
    [attr.aria-describedby]="describedBy() || null"
    [tabIndex]="$index === activeTabIndex() ? 0 : -1"
    (click)="select(option)"
    (keydown)="onKeydown($event, $index)"
  >
    @if (option.dot) {
      <span class="size-unread-dot shrink-0 rounded-full" [class]="option.dot" aria-hidden="true"></span>
    }
    <span>{{ option.label }}</span>
  </button>
}
