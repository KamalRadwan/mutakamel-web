<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Toast — preview</title><link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500&family=Tajawal:wght@400;500&display=swap" rel="stylesheet"></head>
<body dir="rtl">
<div style="display:grid;grid-template-columns:repeat(2,max-content);gap:8px">
<div class="ds-toast"><span class="ds-toast-icon" style="background:var(--success);color:var(--on-success)">✓</span><div><div class="ds-toast-title">تم الحفظ</div><div class="ds-muted">اتسجلت الفاتورة 1042</div></div><i class="ds-toast-bar" style="background:var(--success)"></i></div>
<div class="ds-toast"><span class="ds-toast-icon" style="background:var(--danger);color:var(--on-danger)">×</span><div><div class="ds-toast-title">تعذّر الحفظ</div><div class="ds-muted">انقطع الاتصال بالخادم</div></div><i class="ds-toast-bar" style="background:var(--danger);width:100%"></i></div>
<div class="ds-toast"><span class="ds-toast-icon" style="background:var(--warning);color:var(--on-warning)">!</span><div><div class="ds-toast-title">تنبيه</div><div class="ds-muted">المبلغ أعلى من حد الائتمان</div></div><i class="ds-toast-bar" style="background:var(--warning)"></i></div>
<div class="ds-toast"><span class="ds-toast-icon" style="background:var(--brand);color:var(--on-brand)">i</span><div><div class="ds-toast-title">معلومة</div><div class="ds-muted">فيه تحديث لقائمة الأسعار</div></div><i class="ds-toast-bar" style="background:var(--brand)"></i></div>
</div>
</body>
</html>
