packages:
  - 'admin-portal'
  - 'tenant-portal'
  - 'partner-portal'
  - 'packages/*'

# pnpm 11 otherwise performs a workspace-wide dependency verification before
# every script. That check cannot authenticate to our private GitHub Packages
# registry and needlessly blocks unrelated portals whose dependencies are
# already installed.
verifyDepsBeforeRun: false

# This is a closed-source workspace with a reviewed, integrity-pinned lockfile.
# Trusting it avoids pnpm 11 re-fetching private registry metadata solely to
# re-validate packages that are already locked and present in the local store.
trustLockfile: true

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  minimatch: '>=5.0.0'
  nanoid: '3.3.18'
  postcss: '>=8.5.23'
  sharp: '>=0.35.0'

minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - eslint-config-next@16.3.3
  - next@16.3.3
